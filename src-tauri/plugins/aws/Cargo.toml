[package]
name = "sikemux-plugin-aws"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
sikemux-process = { path = "../../crates/sikemux-process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "process", "io-util"] }

[lints]
workspace = true
