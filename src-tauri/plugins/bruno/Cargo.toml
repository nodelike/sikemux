[package]
name = "sikemux-plugin-bruno"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
url = "2"
tokio = { version = "1", features = ["net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "stream", "multipart"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
