[package]
name = "sikemux-plugin-gcp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
sikemux-process = { path = "../../crates/sikemux-process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
base64 = "0.23"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "stream"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
