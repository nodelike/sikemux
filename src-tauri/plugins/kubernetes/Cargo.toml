[package]
name = "sikemux-plugin-kubernetes"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
sikemux-process = { path = "../../crates/sikemux-process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
