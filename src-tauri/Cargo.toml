[package]
name = "sikemux"
version.workspace = true
description = "The IDE for you and your coding agents"
authors = ["nodelike"]
edition = "2021"
default-run = "sikemux"

[workspace]
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.5.4-nightly.4"

# Only crates that set `lints.workspace = true` get these, which is every
# plugin crate and not the app. A plugin that panics takes the app down.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "sikemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
ipc-command-tests = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.11"
hex = "0.4"

[dependencies]
tauri = { version = "2", default-features = false, features = ["macos-private-api", "wry", "unstable", "compression"] }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
regex = "1"
rayon = "1"
url = "2"
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4", "v7"] }
futures = "0.3"
semver = "1"
sikemux-plugin-api = { path = "crates/sikemux-plugin-api" }
sikemux-keychain = { path = "crates/sikemux-keychain" }
sikemux-loopback = { path = "crates/sikemux-loopback" }
sikemux-process = { path = "crates/sikemux-process" }
sikemux-markdown = { path = "crates/sikemux-markdown" }
sikemux-pty = { path = "crates/sikemux-pty" }
sikemux-core = { path = "crates/sikemux-core" }
sikemux-host = { path = "crates/sikemux-host", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider", "gzip", "stream", "cookies", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }
objc2 = "0.6"
mac-notification-sys = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSBitmapImageRep", "NSControl", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSScreen", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSProcessInfo", "NSString", "NSThread", "NSURL", "NSURLResponse", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKOpenPanelParameters", "WKPDFConfiguration", "WKSecurityOrigin", "WKSnapshotConfiguration", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures", "block2", "objc2-app-kit"] }
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewView", "objc2-app-kit"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }

# Full debug info on our own code costs roughly 15 MB of DWARF per codegen
# unit, and cargo keeps every past build's copy of it forever. Line tables keep
# backtraces pointing at real files without the stored type and variable data.
[profile.dev]
debug = "line-tables-only"

# `make dev` runs an unoptimized build, and the crates that read git objects,
# diff them and parse terminal output are all third party. Leaving them at the
# debug default makes a diff take seconds to appear. Our own code stays
# unoptimized so it still compiles quickly.
[profile.dev.package."*"]
opt-level = 3

# The phone app's build: as fast as release, but a panic in one background
# task fails that task instead of closing the whole app.
[profile.mobile]
inherits = "release"
panic = "unwind"
opt-level = "z"
[profile.mobile.package."*"]
opt-level = "z"

# Built for size, which takes about 1.8 MB off the DMG.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Plugins never sit on a hot path, so they go further and are built for the
# smallest size.
[profile.release.package.sikemux-plugin-aws]
opt-level = "z"
[profile.release.package.sikemux-plugin-azure]
opt-level = "z"
[profile.release.package.sikemux-plugin-bitbucket]
opt-level = "z"
[profile.release.package.sikemux-plugin-bruno]
opt-level = "z"
[profile.release.package.sikemux-plugin-database]
opt-level = "z"
[profile.release.package.sikemux-plugin-github]
opt-level = "z"
[profile.release.package.sikemux-plugin-gitlab]
opt-level = "z"
[profile.release.package.sikemux-plugin-jira]
opt-level = "z"
[profile.release.package.sikemux-plugin-linear]
opt-level = "z"
[profile.release.package.sikemux-plugin-rundeck]
opt-level = "z"
[profile.release.package.sikemux-plugin-signoz]
opt-level = "z"
[profile.release.package.sikemux-plugin-slack]
opt-level = "z"
[profile.release.package.sikemux-plugin-vercel]
opt-level = "z"
# Terminal output, serialization and search run through these for every byte,
