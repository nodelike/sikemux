[package]
name = "sikemux"
version = "0.4.1"
description = "A GUI terminal multiplexer"
authors = ["nodelike"]
edition = "2021"
default-run = "sikemux"

[workspace]
members = ["crates/*", "plugins/*"]

# Only crates that set `lints.workspace = true` get these, which is every
# plugin crate and not the app. A plugin that panics takes the app down.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lib]
name = "sikemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["aws", "bruno", "rundeck", "signoz"]
ipc-command-tests = ["tauri/test"]
aws = ["dep:sikemux-plugin-aws"]
bruno = ["dep:sikemux-plugin-bruno"]
rundeck = ["dep:sikemux-plugin-rundeck"]
signoz = ["dep:sikemux-plugin-signoz"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["macos-private-api", "wry", "unstable", "compression"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
base64 = "0.22"
sha2 = "0.10"
portable-pty = "0.9"
vt100 = "0.16"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
dashmap = "6"
similar = "2"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
regex = "1"
rayon = "1"
url = "2"
tempfile = "3"
linked-hash-map = "0.5"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
semver = "1"
sikemux-plugin-api = { path = "crates/sikemux-plugin-api" }
sikemux-plugin-aws = { path = "plugins/aws", optional = true }
sikemux-plugin-bruno = { path = "plugins/bruno", optional = true }
sikemux-plugin-rundeck = { path = "plugins/rundeck", optional = true }
sikemux-plugin-signoz = { path = "plugins/signoz", optional = true }
sikemux-process = { path = "crates/sikemux-process" }
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
tokio-tungstenite = "0.28"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "stream", "cookies", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
open = "5"
trash = "5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSBitmapImageRep", "NSControl", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSScreen", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSProcessInfo", "NSString", "NSThread", "NSURL", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKContentWorld", "WKFrameInfo", "WKNavigationAction", "WKOpenPanelParameters", "WKPDFConfiguration", "WKSecurityOrigin", "WKSnapshotConfiguration", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures", "block2", "objc2-app-kit"] }
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }

# Full debug info on our own code costs roughly 15 MB of DWARF per codegen
# unit, and cargo keeps every past build's copy of it forever. Line tables keep
# backtraces pointing at real files without the stored type and variable data.
[profile.dev]
debug = "line-tables-only"

# `make dev` runs an unoptimized build, and the crates that read git objects,
# diff them and parse terminal output are all third party. Leaving them at the
# debug default makes a diff take seconds to appear. Our own code stays
# unoptimized so it still compiles quickly.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Sikemux is latency-sensitive (PTY parsing, Git walks, serialization). The
# complete app is already small enough that runtime speed wins over a few MB.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
