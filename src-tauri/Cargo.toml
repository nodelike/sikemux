[package]
name = "sikemux"
version = "0.1.31"
description = "A GUI terminal multiplexer"
authors = ["nodelike"]
edition = "2021"
default-run = "sikemux"

[lib]
name = "sikemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["macos-private-api", "wry"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9"
vt100 = "0.16"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
dashmap = "6"
similar = "2"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
regex = "1"
rayon = "1"
url = "2"
tempfile = "3"
linked-hash-map = "0.5"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "cookies", "multipart"] }
open = "5"
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
# Sikemux is latency-sensitive (PTY parsing, Git walks, serialization). The
# complete app is already small enough that runtime speed wins over a few MB.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
