[package]
name = "sikemux-mobile"
version = "0.1.0"
edition = "2021"
publish = false
description = "The core's client, pairing and connection, as the phone app calls them"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
base64 = "0.22"
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
serde = "1"
serde_json = "1"
sikemux-core = { path = "../sikemux-core" }
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync", "time"] }
uniffi = "0.31"

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# iroh's DNS resolver, network watcher and relay certificate check reach the
# Android runtime through these; android.rs hands them the app's context.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
rustls-platform-verifier = "0.7"
# iroh reports why a connection stalls through tracing; this sends it to logcat.
paranoid-android = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
