[package]
name = "sikemux-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-process = { path = "../sikemux-process" }
agent-client-protocol = { version = "2.0.0", features = ["unstable_session_notices"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sha2 = "0.11"
sikemux-pty = { path = "../sikemux-pty" }
sikemux-wire = { path = "../sikemux-wire" }
thiserror = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
base64 = "0.22"
sikemux-client = { path = "../sikemux-client" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
libc = "0.2"
portable-pty = "0.9"
ring = "0.17"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "getrandom", "rand", "ring", "rustls-bring-your-own-connector", "server", "sha1_smol"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
