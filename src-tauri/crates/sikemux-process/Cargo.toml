[package]
name = "sikemux-process"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
