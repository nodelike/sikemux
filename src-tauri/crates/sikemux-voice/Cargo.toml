[package]
name = "sikemux-voice"
version.workspace = true
edition = "2021"
publish = false
description = "Push-to-talk dictation for every Sikemux app, over the sikemux-voice helper"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sikemux-core = { path = "../sikemux-core" }
sikemux-plugin-api = { path = "../sikemux-plugin-api" }
sikemux-process = { path = "../sikemux-process" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["NSProcessInfo"] }

[build-dependencies]
hex = "0.4"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
