[package]
name = "sikemux-host"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "sikemux_host"

[[bin]]
name = "sikemux-host"
path = "src/main.rs"

[features]
default = ["aws", "bitbucket", "bruno", "database", "github", "gitlab", "jira", "linear", "rundeck", "sentry", "signoz", "slack", "vercel"]
aws = ["dep:sikemux-plugin-aws"]
bitbucket = ["dep:sikemux-plugin-bitbucket"]
gitlab = ["dep:sikemux-plugin-gitlab"]
bruno = ["dep:sikemux-plugin-bruno"]
database = ["dep:sikemux-plugin-database"]
github = ["dep:sikemux-plugin-github"]
jira = ["dep:sikemux-plugin-jira"]
linear = ["dep:sikemux-plugin-linear"]
rundeck = ["dep:sikemux-plugin-rundeck"]
sentry = ["dep:sikemux-plugin-sentry"]
signoz = ["dep:sikemux-plugin-signoz"]
slack = ["dep:sikemux-plugin-slack"]
vercel = ["dep:sikemux-plugin-vercel"]

[build-dependencies]
sha2 = "0.11"
hex = "0.4"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
uuid = { version = "1", features = ["v4", "v7"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sikemux-core = { path = "../sikemux-core" }
sikemux-loopback = { path = "../sikemux-loopback" }
sikemux-keychain = { path = "../sikemux-keychain" }
sikemux-process = { path = "../sikemux-process" }
sikemux-pty = { path = "../sikemux-pty" }
sikemux-plugin-api = { path = "../sikemux-plugin-api" }
sikemux-plugin-aws = { path = "../../plugins/aws", optional = true }
sikemux-plugin-bitbucket = { path = "../../plugins/bitbucket", optional = true }
sikemux-plugin-gitlab = { path = "../../plugins/gitlab", optional = true }
sikemux-plugin-bruno = { path = "../../plugins/bruno", optional = true }
sikemux-plugin-database = { path = "../../plugins/database", optional = true }
sikemux-plugin-github = { path = "../../plugins/github", optional = true }
sikemux-plugin-jira = { path = "../../plugins/jira", optional = true }
sikemux-plugin-linear = { path = "../../plugins/linear", optional = true }
sikemux-plugin-rundeck = { path = "../../plugins/rundeck", optional = true }
sikemux-plugin-sentry = { path = "../../plugins/sentry", optional = true }
sikemux-plugin-signoz = { path = "../../plugins/signoz", optional = true }
sikemux-plugin-slack = { path = "../../plugins/slack", optional = true }
sikemux-plugin-vercel = { path = "../../plugins/vercel", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
