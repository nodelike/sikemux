# XcodeGen spec for FBControlCore alone. Its Swift and Objective-C halves import
# each other, which a SwiftPM target cannot do, so build-sim-helper.mjs builds it
# with this into an xcframework that Package.swift then links.
name: FBControlCore
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/idb/PrivateHeaders
targets:
  FBControlCore:
    type: framework
    platform: macOS
    sources:
      - path: idb/FBControlCore
        excludes:
          - "**/*-Info.plist"
          - "**/*.xcconfig"
          - "**/*.md"
          - "**/FBControlCore-SwiftImport.h"
      - path: idb/FBControlCore/Utility/FBControlCore-SwiftImport.h
        headerVisibility: project
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.FBControlCore
        PRODUCT_NAME: FBControlCore
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        # Xcode leaves the Swift header's directory out of the search path for a mixed module's own .m files.
        HEADER_SEARCH_PATHS: $(inherited) $(OBJECT_FILE_DIR_normal)/$(CURRENT_ARCH)
        CLANG_ENABLE_OBJC_ARC: "YES"
        CLANG_ENABLE_MODULES: "YES"
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/idb/PrivateHeaders/AXRuntime/module.modulemap
        CODE_SIGNING_ALLOWED: "NO"
        DEBUG_INFORMATION_FORMAT: dwarf
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Cocoa.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: Foundation.framework
      - sdk: ServiceManagement.framework
