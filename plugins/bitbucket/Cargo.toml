[package]
name = "sikemux-plugin-bitbucket"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
futures = "0.3"
url = "2"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "stream", "query", "form"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
