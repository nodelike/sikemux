[package]
name = "sikemux-plugin-googleplay"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
futures = "0.3"
ring = "0.17"
sikemux-process = { path = "../../crates/sikemux-process" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "stream"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
