[package]
name = "sikemux-plugin-rundeck"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sikemux-plugin-api = { path = "../../crates/sikemux-plugin-api" }
sikemux-plugin-rundeck-views = { path = "views" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
vte = { version = "0.15", default-features = false, features = ["ansi"] }
url = "2"
percent-encoding = "2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "stream", "cookies", "query", "form"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
