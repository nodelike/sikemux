name: Sikemux
options:
  bundleIdPrefix: com.nodelike.sikemux
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: D577WD6Z5U
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: "1"
    SIKEMUX_COMMIT: ""
  configs:
    Debug:
      SIKEMUX_VARIANT: dev
      SIKEMUX_BUNDLE_ID: com.nodelike.sikemux.mobile.dev
      SIKEMUX_DISPLAY_NAME: Sikemux Dev
      SIKEMUX_URL_SCHEME: sikemux-dev
    Release:
      SIKEMUX_VARIANT: production
      SIKEMUX_BUNDLE_ID: com.nodelike.sikemux.mobile
      SIKEMUX_DISPLAY_NAME: Sikemux
      SIKEMUX_URL_SCHEME: sikemux
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      DEAD_CODE_STRIPPING: true
      STRIP_INSTALLED_PRODUCT: true
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  SikemuxCore:
    type: framework
    platform: iOS
    sources:
      - path: build/bindings/sikemux_mobile.swift
    dependencies:
      - framework: build/SikemuxCore.xcframework
        embed: false
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: com.nodelike.sikemux.core
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true

  Sikemux:
    type: application
    platform: iOS
    sources:
      - path: Sikemux
        excludes:
          - Resources/Info.plist
          - Resources/Sikemux.entitlements
      - path: ../../packaging/icons/sikemux.icon
        buildPhase: resources
      - path: ../../server/protocol/src/release.json
        group: Sikemux/Resources
        buildPhase: resources
      - path: Shared
        excludes: [Notify/Card.generated.swift]
      - path: ../../helpers/notch/Sources/NotchKit/IconView.swift
        group: Sikemux/UI/Notch
      - path: ../../helpers/notch/Sources/NotchKit/Icons.generated.swift
        group: Sikemux/UI/Notch
      - path: ../../helpers/notch/Sources/NotchKit/Buddy.swift
        group: Sikemux/UI/Notch
      - path: ../../helpers/notch/Sources/NotchKit/Buddies.generated.swift
        group: Sikemux/UI/Notch
      - path: ../../helpers/notch/Sources/NotchKit/SVGDrawing.swift
        group: Sikemux/UI/Notch
      - path: ../../helpers/notch/Fonts/Figtree_400Regular.ttf
        group: Sikemux/Resources/Fonts
        buildPhase: resources
      - path: ../../helpers/notch/Fonts/Figtree_500Medium.ttf
        group: Sikemux/Resources/Fonts
        buildPhase: resources
      - path: ../../helpers/notch/Fonts/Figtree_600SemiBold.ttf
        group: Sikemux/Resources/Fonts
        buildPhase: resources
      - path: ../../shared/fonts/Figtree_400Regular_Italic.ttf
        group: Sikemux/Resources/Fonts
        buildPhase: resources
      - path: ../../shared/fonts/JetBrainsMono_400Regular.ttf
        group: Sikemux/Resources/Fonts
        buildPhase: resources
    dependencies:
      - target: SikemuxCore
      - target: SikemuxNotifications
      - target: SikemuxShare
      - sdk: SystemConfiguration.framework
    info:
      path: Sikemux/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(SIKEMUX_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SikemuxVariant: $(SIKEMUX_VARIANT)
        SikemuxCommit: $(SIKEMUX_COMMIT)
        LSRequiresIPhoneOS: true
        SikemuxKeychainGroup: $(DEVELOPMENT_TEAM).$(SIKEMUX_BUNDLE_ID).notify
        SikemuxAppGroup: group.$(SIKEMUX_BUNDLE_ID)
        SikemuxStashKeychainGroup: $(DEVELOPMENT_TEAM).$(SIKEMUX_BUNDLE_ID).stash
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Sikemux asks for Face ID before it shows your hosts and chats.
        NSLocalNetworkUsageDescription: Sikemux reaches your hosts directly when they are on the same network.
        NSPhotoLibraryUsageDescription: Sikemux shows your recent photos so you can attach them to a chat.
        NSCameraUsageDescription: Sikemux uses the camera to take a photo you attach to a chat.
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: Ground
        UIAppFonts:
          - Figtree_400Regular.ttf
          - Figtree_400Regular_Italic.ttf
          - Figtree_500Medium.ttf
          - Figtree_600SemiBold.ttf
          - JetBrainsMono_400Regular.ttf
        CFBundleURLTypes:
          - CFBundleURLName: $(SIKEMUX_BUNDLE_ID)
            CFBundleURLSchemes: [$(SIKEMUX_URL_SCHEME)]
    entitlements:
      path: Sikemux/Resources/Sikemux.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.$(SIKEMUX_BUNDLE_ID)]
        com.apple.developer.applesignin: [Default]
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(SIKEMUX_BUNDLE_ID)
          - $(AppIdentifierPrefix)$(SIKEMUX_BUNDLE_ID).notify
          - $(AppIdentifierPrefix)$(SIKEMUX_BUNDLE_ID).stash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIKEMUX_BUNDLE_ID)
        PRODUCT_NAME: Sikemux
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: dev
          EXCLUDED_SOURCE_FILE_NAMES: sikemux.icon
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: sikemux
          EXCLUDED_SOURCE_FILE_NAMES: dev.icon
          # Nothing loads symbols from the app, and the Rust library's exports alone took 1.8 MB.
          LD_EXPORT_SYMBOLS: false

  SikemuxNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: Notifications
        excludes: [Info.plist, SikemuxNotifications.entitlements]
      - path: Shared/Notify
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: SikemuxNotifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SikemuxKeychainGroup: $(DEVELOPMENT_TEAM).$(SIKEMUX_BUNDLE_ID).notify
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/SikemuxNotifications.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(SIKEMUX_BUNDLE_ID).notify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIKEMUX_BUNDLE_ID).notifications
        CODE_SIGN_STYLE: Automatic

  SikemuxShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        excludes: [Info.plist, SikemuxShare.entitlements]
      - path: Shared/Stash
      - path: Sikemux/UI/Theme.swift
      - path: ../../helpers/notch/Sources/NotchKit/IconView.swift
        group: Sikemux/UI/Notch
      - path: ../../helpers/notch/Sources/NotchKit/Icons.generated.swift
        group: Sikemux/UI/Notch
    dependencies:
      - sdk: LinkPresentation.framework
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: $(SIKEMUX_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SikemuxAppGroup: group.$(SIKEMUX_BUNDLE_ID)
        SikemuxStashKeychainGroup: $(DEVELOPMENT_TEAM).$(SIKEMUX_BUNDLE_ID).stash
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    entitlements:
      path: Share/SikemuxShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(SIKEMUX_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(SIKEMUX_BUNDLE_ID).stash]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIKEMUX_BUNDLE_ID).share
        CODE_SIGN_STYLE: Automatic

schemes:
  Sikemux:
    build:
      targets:
        Sikemux: all
    run:
      config: Debug
    archive:
      config: Release
