<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sikemux perf</title>
    <script>
      // Runs before any module loads, so startup is timed from the start of the page.
      window.perfBoot = new Promise((done) => {
        const frames = [];
        let last = performance.now();
        let firstPane = null;
        const tick = () => {
          const now = performance.now();
          frames.push({ at: now, length: now - last });
          last = now;
          if (firstPane === null && document.querySelector(".pane")) firstPane = now;
          if (firstPane !== null && now - firstPane > 2000) done({ firstPane, frames });
          else requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/showcase/main.ts"></script>
    <script type="module" src="/showcase/perf.ts"></script>
  </body>
</html>
