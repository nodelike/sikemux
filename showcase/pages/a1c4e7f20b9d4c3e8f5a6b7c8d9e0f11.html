<!doctype html><html><head><meta charset="utf-8" /><style>
:root { color-scheme: dark; }
html { background: transparent; color: #e7e5ef; font: 14px/1.5 Figtree, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 4px 2px 10px; }
h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.sub { margin: 0 0 16px; color: #a9a5b6; font-size: 13px; }
.card { border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: rgba(255,255,255,.035); }
.mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }

.diagram { padding: 18px 14px 10px; }
svg text { font: 12px -apple-system, system-ui, sans-serif; fill: #e7e5ef; }
svg .dim { fill: #8b8898; font-size: 11px; }
svg .node { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.16); }
svg .hot { fill: rgba(255,103,103,.10); stroke: #ff6767; }
svg .edge { stroke: #6f6a80; stroke-width: 1.4; fill: none; }
svg .bad { stroke: #ff6767; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
.legend { display: flex; gap: 18px; padding: 10px 4px 0; font-size: 12px; color: #a9a5b6; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 1.6px solid #6f6a80; vertical-align: middle; margin-right: 6px; }
.legend .b { border-top: 1.8px dashed #ff6767; }
</style></head><body>
<h1>How a checkout request flows</h1>
<p class="sub">Traced from billing-service. The 500s start where payments times out.</p>
<div class="card diagram">
<svg viewBox="0 -4 760 254" width="100%">
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#6f6a80"/></marker>
  <marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ff6767"/></marker></defs>
  <rect class="node" x="10" y="95" width="110" height="56" rx="10"/><text x="65" y="120" text-anchor="middle">Web app</text><text class="dim" x="65" y="138" text-anchor="middle">Pay now</text>
  <rect class="node" x="175" y="95" width="120" height="56" rx="10"/><text x="235" y="120" text-anchor="middle">API gateway</text><text class="dim" x="235" y="138" text-anchor="middle">/v2/checkout</text>
  <rect class="node" x="350" y="95" width="140" height="56" rx="10"/><text x="420" y="120" text-anchor="middle">billing-service</text><text class="dim" x="420" y="138" text-anchor="middle">CheckoutHandler</text>
  <rect class="hot" x="560" y="20" width="185" height="56" rx="10"/><text x="652" y="45" text-anchor="middle">payments-api</text><text class="dim" x="652" y="63" text-anchor="middle">p95 3.4 s, timeout 3 s</text>
  <rect class="node" x="560" y="98" width="185" height="50" rx="10"/><text x="652" y="120" text-anchor="middle">orders (Postgres)</text><text class="dim" x="652" y="137" text-anchor="middle">insert, 12 ms</text>
  <rect class="node" x="560" y="172" width="185" height="56" rx="10"/><text x="652" y="197" text-anchor="middle">email-worker</text><text class="dim" x="652" y="215" text-anchor="middle">queued receipt</text>
  <path class="edge" d="M120 123H170" marker-end="url(#a)"/>
  <path class="edge" d="M295 123H345" marker-end="url(#a)"/>
  <path class="bad" d="M490 110C525 110 525 48 555 48" marker-end="url(#r)"/>
  <path class="edge" d="M490 123H555" marker-end="url(#a)"/>
  <path class="edge" d="M490 136C525 136 525 200 555 200" marker-end="url(#a)"/>
  <text x="652" y="12" text-anchor="middle" fill="#ff8a8a" style="font-size:11px">billing gets a 500 after 3 s</text>
</svg>
<div class="legend"><span><i></i>call</span><span><i class="b"></i>times out since 08:40</span></div>
</div>
<script>
const post = () => parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: Math.ceil(document.documentElement.getBoundingClientRect().height) } }, "*");
new ResizeObserver(post).observe(document.documentElement); addEventListener("load", post);
</script></body></html>
