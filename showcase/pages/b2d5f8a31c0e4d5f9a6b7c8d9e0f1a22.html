<!doctype html><html><head><meta charset="utf-8" /><style>
:root { color-scheme: dark; }
html { background: transparent; color: #e7e5ef; font: 14px/1.5 Figtree, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 4px 2px 10px; }
h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.sub { margin: 0 0 16px; color: #a9a5b6; font-size: 13px; }
.card { border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: rgba(255,255,255,.035); }
.mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.stat { padding: 10px 14px; }
.stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: #8b8898; }
.up { color: #ff8a8a; } .down { color: #61ffca; }
.chart { padding: 14px 12px 6px; }
svg text { font: 11px -apple-system, system-ui, sans-serif; fill: #8b8898; }
</style></head><body>
<h1>checkout p95 latency, last 24 hours</h1>
<p class="sub">From SigNoz. The fix went out at 17:05.</p>
<div class="stats">
  <div class="card stat"><span>p95 before</span><b class="up">3.1 s</b></div>
  <div class="card stat"><span>p95 now</span><b class="down">390 ms</b></div>
  <div class="card stat"><span>failed checkouts</span><b>212 → 0</b></div>
</div>
<div class="card chart">

</svg>
</div>
<script>
const post = () => parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: Math.ceil(document.documentElement.getBoundingClientRect().height) } }, "*");
new ResizeObserver(post).observe(document.documentElement); addEventListener("load", post);
</script></body></html>
