<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sikemux · Twitter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      /* Every download is cut from this one 16:9 stage, saved at 2.25x. Here it is scaled to fit the browser. */
      .stage {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000 url("/__showcase/wallpaper") center / cover no-repeat;
        transform: translate(-50%, -50%) scale(var(--fit, 1));
      }

      iframe {
        position: absolute;
        inset: 27px 115px;
        width: calc(100% - 230px);
        height: calc(100% - 54px);
        border: 0;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.09),
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .controls {
        position: fixed;
        right: 16px;
        bottom: 14px;
        display: flex;
        gap: 8px;
      }

      .is-capturing .controls {
        display: none;
      }

      button {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 500 12px system-ui;
        cursor: pointer;
      }

      input,
      .shot,
      .has-screenshot iframe {
        display: none;
      }

      /* An uploaded screenshot fills the stage, with a blurred copy of itself behind the margins. */
      .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .has-screenshot .shot {
        display: block;
      }

      .shot.is-backdrop {
        object-fit: cover;
        filter: blur(48px) brightness(0.8);
        transform: scale(1.15);
      }

      .shot.is-front {
        object-fit: contain;
      }

      /* The island hangs from the top edge of the screen, as it does from a MacBook's notch. */
      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        width: 760px;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .notch:not([src]) {
        display: none;
      }

      /* The window drops below the closed island, leaving a gap. */
      .has-notch iframe {
        top: 54px;
        height: calc(100% - 81px);
      }

      .app-view {
        display: none;
      }

      .has-screenshot .app-view {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <iframe src="/showcase/?play" title="Sikemux"></iframe>
      <img class="shot is-backdrop" alt="" />
      <img class="shot is-front" alt="" />
      <img class="notch" alt="" />
    </div>
    <div class="controls">
      <button type="button" class="wallpaper">Wallpaper</button>
      <button type="button" class="screenshot">Screenshot</button>
      <button type="button" class="app-view">App</button>
      <button type="button" class="notch-view">Notch</button>
      <button type="button" data-layout="landscape">Landscape</button>
      <button type="button" data-layout="thirds">Thirds</button>
      <input type="file" class="wallpaper-picker" accept="image/*" />
      <input type="file" class="screenshot-picker" accept="image/*" />
    </div>
    <script type="module">
      const stage = document.querySelector(".stage");
      const picker = document.querySelector(".wallpaper-picker");
      const shotPicker = document.querySelector(".screenshot-picker");
      const app = document.querySelector("iframe").contentWindow;

      function showScreenshot() {
        const src = `/__showcase/screenshot?v=${Date.now()}`;
        for (const image of document.querySelectorAll(".shot")) image.src = src;
        document.documentElement.classList.add("has-screenshot");
      }

      const params = new URLSearchParams(location.search);
      if (params.has("screenshot")) showScreenshot();

      const NOTCH_STATES = { closed: "C3-needs-you", open: "O1-inbox", off: null };
      const notchButton = document.querySelector(".notch-view");
      let notch = params.get("notch") ?? "closed";
      function showNotch() {
        const image = document.querySelector(".notch");
        const state = NOTCH_STATES[notch];
        if (state) image.src = `/__showcase/notch/${state}.png`;
        else image.removeAttribute("src");
        document.documentElement.classList.toggle("has-notch", Boolean(state));
        notchButton.textContent = `Notch: ${notch}`;
      }
      notchButton.addEventListener("click", () => {
        const names = Object.keys(NOTCH_STATES);
        notch = names[(names.indexOf(notch) + 1) % names.length];
        showNotch();
      });
      showNotch();

      if (params.has("capture")) {
        document.documentElement.classList.add("is-capturing");
      } else {
        const fit = () =>
          stage.style.setProperty(
            "--fit",
            Math.min(1, (innerWidth - 32) / 1920, (innerHeight - 96) / 1080),
          );
        addEventListener("resize", fit);
        fit();
      }

      // The server keeps the picture, so its own Chrome paints the same wallpaper into each download.
      document.querySelector(".wallpaper").addEventListener("click", () =>
        picker.click(),
      );
      picker.addEventListener("change", async () => {
        const [file] = picker.files;
        if (!file) return;
        await fetch("/__showcase/wallpaper", { method: "POST", body: file });
        stage.style.backgroundImage = `url("/__showcase/wallpaper?v=${Date.now()}")`;
        picker.value = "";
      });

      document.querySelector(".screenshot").addEventListener("click", () =>
        shotPicker.click(),
      );
      shotPicker.addEventListener("change", async () => {
        const [file] = shotPicker.files;
        if (!file) return;
        await fetch("/__showcase/screenshot", { method: "POST", body: file });
        showScreenshot();
        shotPicker.value = "";
      });
      document.querySelector(".app-view").addEventListener("click", () =>
        document.documentElement.classList.remove("has-screenshot"),
      );

      // A page cannot screenshot itself, so the showcase server renders this view in its own Chrome.
      async function saveOnServer(layout) {
        const response = await fetch("/__showcase/snapshot", {
          method: "POST",
          body: JSON.stringify(
            document.documentElement.classList.contains("has-screenshot")
              ? { screenshot: true, layout, notch }
              : { state: app.showcase.store.getState(), layout, notch },
          ),
        });
        const saved = await response.json();
        if (!response.ok) throw new Error(saved.error);
        return saved;
      }

      for (const button of document.querySelectorAll("[data-layout]")) {
        const label = button.textContent;
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const saved = await saveOnServer(button.dataset.layout);
            button.textContent = `Saved ${saved.length > 1 ? `${saved.length} images` : saved[0]}`;
          } catch (error) {
            button.textContent = "Not saved";
            console.warn(error);
          }
          setTimeout(() => {
            button.textContent = label;
            button.disabled = false;
          }, 1600);
        });
      }
    </script>
  </body>
</html>
