name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install && pnpm build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ${{ contains(github.ref_name, '-nightly.') }}; then
            gh release create "$GITHUB_REF_NAME" dist/* --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/*
          fi
