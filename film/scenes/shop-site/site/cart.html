<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme cart</title>
<style>
body{font-family:-apple-system,Helvetica,sans-serif;margin:0;background:#f6f6f4;color:#1c1c1f}
main{max-width:720px;margin:0 auto;padding:32px 20px}
h1{font-size:24px;margin:0 0 4px}.sub{color:#6b6b73;margin-bottom:24px}
.card{background:#fff;border:1px solid #e3e3df;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;padding:6px 0}.muted{color:#6b6b73}
.total{font-weight:700;border-top:1px solid #e3e3df;margin-top:8px;padding-top:12px}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#7c5cff;color:#fff;font-size:15px;font-weight:600}
</style></head>
<body><main>
<h1>Your cart</h1><div class="sub">Acme Supply Co. · 3 items</div>
<div class="card">
<div class="row"><span>HB pencil × 3</span><span>$2.85</span></div>
<div class="row muted"><span>Tax, 19%</span><span>$0.54</span></div>
<div class="row total"><span>Total</span><span>$3.39</span></div>
</div>
<div class="card"><div class="row"><span>Receipt preview</span><span>$3.39</span></div><button>Check out</button></div>
</main></body></html>
