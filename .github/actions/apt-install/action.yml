name: Install Ubuntu packages
description: Installs what the app builds with and any other packages with apt, and keeps the downloaded .deb files between runs, so a slow mirror costs one run, not every run.
inputs:
  packages:
    description: Packages to install beside packaging/linux/build-packages.txt, separated by spaces or newlines
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Name the package cache
      id: cache
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        list="$(cat packaging/linux/build-packages.txt - <<<"$PACKAGES" | tr -s ' \n' '\n' | sort | shasum -a 256 | cut -c1-16)"
        echo "prefix=apt-$ImageOS-$RUNNER_ARCH-$list-" >>"$GITHUB_OUTPUT"
        echo "week=$(date +%G-%V)" >>"$GITHUB_OUTPUT"

    # A new key each week picks up updated packages; last week's .debs still cover most of them.
    - name: Restore the downloaded packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.cache.outputs.prefix }}${{ steps.cache.outputs.week }}
        restore-keys: ${{ steps.cache.outputs.prefix }}

    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get update
        read -ra packages <<<"$(cat packaging/linux/build-packages.txt - <<<"$PACKAGES" | tr -s ' \n' ' ')"
        sudo apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-archives" "${packages[@]}"
