name: Install cargo-nextest
description: Installs nextest, which runs every test binary at once where cargo test runs them one after another.
runs:
  using: composite
  steps:
    - name: Download nextest and check it against its published hash
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          macOS-*) build=universal-apple-darwin hash=47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507 ;;
          Linux-X64) build=x86_64-unknown-linux-gnu hash=32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770 ;;
          Linux-ARM64) build=aarch64-unknown-linux-gnu hash=6f82e375187cf3a1f3e336879a51940c315a5d0ce7253f7e517ad28295b74189 ;;
          *) echo "::error::no nextest build is pinned for $RUNNER_OS $RUNNER_ARCH" && exit 1 ;;
        esac
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-$build.tar.gz"
        echo "$hash  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        mkdir -p "$bin"
        tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$bin"
        echo "$bin" >>"$GITHUB_PATH"
