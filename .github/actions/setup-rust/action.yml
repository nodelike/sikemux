name: Setup Rust
description: Installs the toolchain rust-toolchain.toml pins and removes every other one the runner image carries.
inputs:
  components:
    description: Extra components, separated by spaces
    required: false
    default: ""
  targets:
    description: Extra targets, separated by spaces
    required: false
    default: ""
  cache:
    description: Restore and save cargo's cache, with dependencies at the job's DEPS_OPT_LEVEL
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Spotlight indexes what the cache restores and the build writes; with it on, the core took 40% longer to compile.
    - name: Stop Spotlight indexing
      if: runner.os == 'macOS'
      shell: bash
      run: sudo mdutil -a -i off || echo "::warning::Spotlight indexing could not be stopped, so this job builds slower"

    # rust-cache keys its caches on every installed toolchain, and runner images differ in which
    # ones they carry, so a stray one would split the cache between images.
    - name: Install the pinned toolchain alone
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        flags=()
        for component in $COMPONENTS; do flags+=(--component "$component"); done
        for target in $TARGETS; do flags+=(--target "$target"); done
        rustup toolchain install "$channel" --profile minimal --no-self-update "${flags[@]}"
        rustup default "$channel"
        for toolchain in $(rustup toolchain list --quiet); do
          [[ "$toolchain" == "$channel"-* ]] || rustup toolchain uninstall "$toolchain"
        done
        rustup toolchain list

    - name: Build dependencies with light optimisation
      if: inputs.cache == 'true'
      shell: bash
      run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

    - name: Cache cargo
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
