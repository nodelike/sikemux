name: Package repository proof
on:
  push:
    branches: [proof/package-repos]
permissions:
  contents: read
jobs:
  install:
    name: Upgrade through the real repository on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the previous nightly and upgrade it through packages-nightly
        run: docker run --rm -v "$PWD/.github/package-proof:/proof:ro" "${{ matrix.image }}" sh -x /proof/real-apt.sh 0.6.1-nightly.22 0.6.1-nightly.2688
