name: Mobile CI

# Checks the phone app before its code ships: ci.yml leaves mobile/ out, and the update and release
# workflows only run after the fact. Also runs the notifications module's Kotlin tests, which nothing
# else does.
on:
  push:
    branches: [main]
    paths: &paths
      - "mobile/**"
      - "crates/sikemux-mobile/**"
      - "crates/sikemux-core/**"
      - "Cargo.lock"
      - "server/protocol/**"
      - "shared/**"
      - .github/workflows/mobile-ci.yml
      - .github/workflows/mobile-update.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the phone app and its Kotlin
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: mobile/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            mobile/pnpm-lock.yaml

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mobile-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install phone dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      # Gradle would otherwise download React Native's NDK mid-build, and that download fails often.
      - name: Install the NDK React Native builds with
        working-directory: mobile/app
        run: |
          ndk="$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)"
          for _ in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null && break
            sleep 20
          done
          test -d "$ANDROID_HOME/ndk/$ndk"

      # The app's JavaScript imports the bindings generated alongside the Rust client, and the
      # Android project links it.
      - name: Build the Rust client
        working-directory: mobile
        run: pnpm native:android:release

      - name: Check the phone app
        working-directory: mobile
        run: pnpm check

      - name: Generate the Android project
        working-directory: mobile/app
        run: node scripts/run.mjs prebuild android development

      - name: Test the notifications module
        working-directory: mobile/app/android
        run: |
          # The generated wrapper gives up on downloading Gradle after 10 seconds, too short from a runner.
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew :notify:testDebugUnitTest --no-daemon
