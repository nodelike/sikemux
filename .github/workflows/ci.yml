name: CI

on:
  push:
    branches: [main]
    # README.md and CONTRIBUTING.md stay out of this list because format:check covers them.
    paths-ignore:
      - "docs/**"
      - AGENTS.md
      - CLA.md
      - CLAUDE.md
      - DESIGN.md
      - RELEASE_NOTES.md
      # server.yml checks and deploys the backend.
      - "server/**"
      # The phone workflows check the phone app.
      - "mobile/**"
      - ".github/workflows/mobile-*.yml"
  # A PR that skipped the whole workflow would leave its required checks waiting forever,
  # so PRs always start it and the changes job skips what they don't touch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub runs schedules only from the default branch.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: Also open GPUI in a real window and capture it
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  actions: read

# One run at a time per branch. A run that has started always finishes, so main keeps getting
# results; of the pushes that arrive meanwhile only the newest runs next, and the older waiting
# ones are cancelled. A new push to a pull request stops its running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cargo.toml builds dependencies at full speed so `make dev` feels fast. CI only
# tests them, and level 1 compiles in about half the time. The cache key carries
# the level, since cargo rebuilds every dependency when it changes.
env:
  DEPS_OPT_LEVEL: 1
  # Tests and checks never read debug info, and leaving it out makes compiling and linking much faster.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Compares against main's last run that ran to a result, and also runs every area a job of that
  # run failed or was stopped in, so a failed job keeps running until it passes again.
  changes:
    name: What changed
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      simulator: ${{ steps.areas.outputs.simulator }}
      helpers: ${{ steps.areas.outputs.helpers }}
      packaging: ${{ steps.areas.outputs.packaging }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Pick the jobs this change needs
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          rerun=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            read -r run base < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=50" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0] // empty | "\(.id) \(.head_sha)"') || true
            if [ -n "${run:-}" ]; then
              failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name')" || base=""
              while IFS= read -r job; do
                case "$job" in
                  "") ;;
                  "Dependency audit" | "Frontend quality, build, and tests" | "GPUI in a real window") ;;
                  "Linux compile check and core tests"*) rerun+=" rust packaging" ;;
                  "Rust "* | "Core unit tests" | "GPUI app tests" | "GPUI on Linux in a real window") rerun+=" rust" ;;
                  "iOS Simulator helper") rerun+=" simulator" ;;
                  "Notch and voice helpers") rerun+=" helpers" ;;
                  *) base="" ;;
                esac
              done <<<"$failed"
              printf 'Run %s failed or stopped in:\n%s\n' "$run" "$failed"
            fi
          fi

          git merge-base --is-ancestor "$base" HEAD 2>/dev/null || base=""
          changed="$(git diff --name-only "${base:-HEAD}" HEAD)"
          printf 'Compared with %s:\n%s\n' "${base:-nothing, so every job runs}" "$changed"

          area() {
            name="$1" needs="$2" ignores="${3:-^$}"
            if [ -z "$base" ] || [[ " $rerun " == *" $name "* ]] ||
              printf '%s\n' "$changed" | grep -vE "$ignores" | grep -qE "^\.github/(workflows/ci\.yml$|actions/)|$needs"; then
              echo "$name=true" >>"$GITHUB_OUTPUT"
            else
              echo "$name=false" >>"$GITHUB_OUTPUT"
              echo "Skipped $name: nothing it checks changed, and it passed last run" >>"$GITHUB_STEP_SUMMARY"
            fi
          }
          area rust '^(app/|crates/|plugins/|packaging/linux/build-packages\.txt$|Cargo\.(toml|lock)$|\.config/hakari\.toml$|clippy\.toml$|tools/|rust-toolchain\.toml$)'
          area simulator '^(helpers/sim/|crates/sikemux-simulator/|crates/sikemux-base/|crates/helper_build\.rs$|Cargo\.(toml|lock)$|scripts/build-sim-(helper|fixture)\.mjs$|scripts/lib/build\.mjs$|rust-toolchain\.toml$)'
          area helpers '^(helpers/(notch|voice)/|scripts/build-(notch|voice)-helper\.mjs$|scripts/generate-notch-(icons|sources)\.mjs$|scripts/lib/build\.mjs$|scripts/app-metadata\.mjs$)'
          area packaging '^(scripts/build-linux\.sh$|scripts/build-core\.mjs$|scripts/smoke-core\.mjs$|scripts/app-metadata\.mjs$|scripts/lib/build\.mjs$|scripts/install\.sh$|scripts/package-host\.sh$|scripts/smoke-host-install\.sh$|brand/linux/|packaging/linux/|crates/sikemux-core/resources/sikemux_pi_tools\.ts$)'

  # The same check as `pnpm deps:audit`: any vulnerability fails it, and so does any unsound or
  # unmaintained warning dependency-audit.json does not explain. Advisories arrive without a change
  # here, so it also runs on the nightly schedule.
  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-audit.tgz" https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $RUNNER_TEMP/cargo-audit.tgz" | shasum -a 256 -c -
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$bin" --strip-components 1 cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
          echo "$bin" >>"$GITHUB_PATH"

      - name: Audit the dependencies
        run: pnpm deps:audit

  frontend:
    name: Frontend quality, build, and tests
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install the generators' dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated files match their sources
        run: pnpm check:generated

      - name: Install shellcheck
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components 1 shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Check formatting, lint, types and release tooling
        run: pnpm check:code

  # Neither needs a build or a Mac: hakari.toml names the platforms workspace-hack is made for.
  rust-format:
    name: Rust formatting and workspace-hack
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: scripts/check-rust.sh fmt

      - name: Install cargo-hakari
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hakari.tar.gz" https://github.com/guppy-rs/guppy/releases/download/cargo-hakari-0.9.39/cargo-hakari-0.9.39-x86_64-unknown-linux-gnu.tar.gz
          echo "699a3193a9bd1a8d914b970d3f50f3385f24fbd8b1294d0c0ff31fbe7c2c9f48  $RUNNER_TEMP/hakari.tar.gz" | shasum -a 256 -c -
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          tar -xzf "$RUNNER_TEMP/hakari.tar.gz" -C "$bin"
          echo "$bin" >>"$GITHUB_PATH"

      - name: Check workspace-hack is up to date
        run: scripts/check-rust.sh hakari

  # The core's and the GPUI app's macOS-only code is linted only here; the build without plugins
  # changes no macOS code, so the Linux job lints it.
  rust-lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when a Linux check fails
        uses: ./.github/actions/stop-on-linux-failure

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"
          components: clippy

      - name: Run Clippy
        run: scripts/check-rust.sh clippy

      - name: Run Clippy on the GPUI app
        run: scripts/check-rust.sh gpui-clippy

  # The tests run as two jobs so that each compiles the core once: one runner compiling it with and
  # without its unit tests at once took ten minutes, and three to four for each alone.
  rust-core-tests:
    name: Core unit tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when a Linux check fails
        uses: ./.github/actions/stop-on-linux-failure

      # Built alone, the core takes 58 of its dependencies with other features than the whole workspace
      # gives them. Building those again each run costs about a minute; a cache of this job's own was 590 MB.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"
          cache-from: rust-tests

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      - name: Run the core's unit tests
        run: scripts/check-rust.sh core-unit-tests

  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when a Linux check fails
        uses: ./.github/actions/stop-on-linux-failure

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      - name: Run every test but the core's unit tests
        run: scripts/check-rust.sh other-tests

  # Branch protection requires a check of this name, which was one job before its work was split.
  rust:
    name: Rust formatting, lint, and tests
    needs: [changes, rust-format, rust-lint, rust-core-tests, rust-tests, linux]
    if: always() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Rust job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # The test jobs above leave out the GPUI app, which this one builds alongside them.
  gpui:
    name: GPUI app tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when a Linux check fails
        uses: ./.github/actions/stop-on-linux-failure

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Run Rust tests
        run: scripts/check-rust.sh gpui-test

  # Whether GPUI's Metal renderer draws on a runner: a window is opened in the runner's own
  # session and captured. It takes up to two hours, so it runs daily and by hand with
  # `window` checked, not on every push.
  gpui-window:
    name: GPUI in a real window
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.window)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"
          cache-from: gpui

      - name: Build the window probe
        run: cargo build --example window_probe
        working-directory: app

      - name: Draw a window and capture it
        working-directory: app
        run: |
          mkdir -p window-run
          system_profiler SPDisplaysDataType > window-run/displays.txt
          ../target/debug/examples/window_probe 30 > window-run/probe.log 2>&1 &
          probe=$!
          for _ in $(seq 1 40); do
            number=$(swift ci/window-number.swift "$probe" 2>/dev/null) && break
            sleep 0.5
          done
          echo "window ${number:-none}" | tee -a window-run/probe.log
          sleep 3
          if [ -n "${number:-}" ]; then screencapture -x -o -l "$number" window-run/window.png; fi
          screencapture -x window-run/screen.png
          kill "$probe" 2>/dev/null || true
          test -s window-run/window.png

      - name: Build the core and the fake agent
        run: cargo build -p sikemux-core --bin sikemux-core --bin sikemux-fake-acp-agent

      - name: Build the app with its in-app driver
        run: cargo build --features drive --bin sikemux --example fake_chat
        working-directory: app

      # The checks' cores listen on sockets inside their output folders, and a socket's path must stay
      # under 104 bytes, which the checkout's own path would pass.
      - name: Drive the desk checks
        working-directory: app
        run: >-
          python3 -I ci/desk-checks.py --app ../target/debug/sikemux
          --core ../target/debug/sikemux-core --agent ../target/debug/sikemux-fake-acp-agent
          --seed ../target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/desk"

      - name: Check the ground's grain, picture and see-through
        if: ${{ !cancelled() }}
        working-directory: app
        run: >-
          python3 -I ci/ground-check.py --app ../target/debug/sikemux
          --core ../target/debug/sikemux-core --agent ../target/debug/sikemux-fake-acp-agent
          --seed ../target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/ground"

      - name: Check What's New's sky moves when it opens as the app starts
        if: ${{ !cancelled() }}
        working-directory: app
        run: >-
          python3 -I ci/sky-check.py --app ../target/debug/sikemux
          --core ../target/debug/sikemux-core --agent ../target/debug/sikemux-fake-acp-agent
          --seed ../target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/sky"

      - name: Check the core knows its window, and only it, after the window opens again
        if: ${{ !cancelled() }}
        working-directory: app
        run: >-
          python3 -I ci/trust-check.py --app ../target/debug/sikemux
          --core ../target/debug/sikemux-core --agent ../target/debug/sikemux-fake-acp-agent
          --seed ../target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/trust"

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-window
          path: |
            app/window-run
            ${{ runner.temp }}/w
          if-no-files-found: warn

  # The GPUI app on Linux in a real X window: Xvfb with a window manager, the app and a throwaway core with
  # fake agents only, each check captured. With --browser it also opens a desk tab on a local page and drives
  # an agent browser tool there.
  gpui-linux-window:
    name: GPUI on Linux in a real window
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The runner holds no agent CLIs; the core looks only on PATH regardless.
      SIKEMUX_AGENT_SEARCH: path
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Install GPUI's Linux packages, an X server and a window manager
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            xvfb openbox x11-utils xdotool imagemagick mesa-vulkan-drivers fonts-dejavu-core
            xdg-desktop-portal xdg-desktop-portal-gtk dconf-gsettings-backend gsettings-desktop-schemas libglib2.0-bin
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly ffmpeg

      - name: Build the core and the fake agent
        run: cargo build --locked -p sikemux-core --bin sikemux-core --bin sikemux-fake-acp-agent

      - name: Build the app with its in-app driver
        run: cargo build --locked --features drive --bin sikemux --example fake_chat
        working-directory: app

      - name: Open the app in a real window and check it
        working-directory: app
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
          export DISPLAY=:99
          for _ in $(seq 1 40); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.25; done
          openbox &
          sleep 1
          # The desktop portal answers the app's animation setting from GNOME's, which the check toggles.
          export XDG_CURRENT_DESKTOP=GNOME
          mkdir -p ~/.config/xdg-desktop-portal
          printf '[preferred]\ndefault=gtk\n' > ~/.config/xdg-desktop-portal/portals.conf
          bus=(); command -v dbus-run-session >/dev/null && bus=(dbus-run-session --)
          "${bus[@]}" python3 -I ci/linux-window.py --app ../target/debug/sikemux \
            --core ../target/debug/sikemux-core --agent ../target/debug/sikemux-fake-acp-agent \
            --seed ../target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/linux" --browser --input

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-linux-window
          path: |
            ${{ runner.temp }}/w
            !${{ runner.temp }}/w/linux/run/app
            !${{ runner.temp }}/w/linux/run/bin
            !${{ runner.temp }}/w/linux/run/data/agent-*
          if-no-files-found: warn

  # Every release also ships Linux packages, so main must keep compiling there,
  # and the core must keep working as a Linux host.
  linux:
    name: Linux compile check and core tests (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CORE_CRATES: -p sikemux-core -p sikemux-pty -p sikemux-process -p sikemux-wire -p sikemux-view -p sikemux-client -p sikemux-keychain -p sikemux-host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Mostly GPUI's, as Zed's script/linux lists them.
      - name: Install the Linux packages
        uses: ./.github/actions/apt-install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      # The tests that fail most often run first, so a broken push stops the Mac jobs sooner.
      - name: Check the agent tools fit their budgets
        if: matrix.arch == 'aarch64'
        run: |
          read -ra crates <<<"$CORE_CRATES"
          cargo nextest run --locked "${crates[@]}" -E 'test(/^tools_mcp::tests::/)'

      - name: Check the app compiles on Linux and passes Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check the GPUI app on Linux
        run: scripts/check-rust.sh gpui-clippy

      - name: Build without any plugins
        if: matrix.arch == 'x86_64'
        run: scripts/check-rust.sh no-plugins

      # nextest leaves doc tests out, so cargo runs those.
      - name: Run the core's tests on Linux
        run: |
          read -ra crates <<<"$CORE_CRATES"
          cargo nextest run --locked "${crates[@]}"
          cargo test --locked --doc "${crates[@]}"

      # The packages are unsigned and go nowhere but this run.
      - name: Install what the app packs with
        if: needs.changes.outputs.packaging == 'true'
        run: xargs sudo apt-get install -y <packaging/linux/pack-packages.txt

      # These packages only prove the packing works, so they skip the release build's whole-program
      # LTO, which tripled the compile. The Release workflow's Linux jobs still build with it.
      - name: Pack the deb, rpm and AppImage
        if: needs.changes.outputs.packaging == 'true'
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: scripts/build-linux.sh

      - name: Install the deb on a clean Ubuntu
        if: needs.changes.outputs.packaging == 'true'
        run: |
          docker run --rm -v "$PWD/target/release/bundle/deb:/packages:ro" ubuntu:24.04 sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/*.deb >/dev/null
            sikemux-host --version
            test -g /usr/lib/sikemux/sikemux-host
            test "$(stat -c %G /usr/lib/sikemux/sikemux-host)" = sikemux
            test "$(stat -c %G:%a /var/lib/sikemux)" = sikemux:770
            test -f /usr/lib/sikemux/sikemux_pi_tools.ts
          '

      - name: Keep the packages on the run
        if: needs.changes.outputs.packaging == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-linux-packages-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  simulator-helper:
    name: iOS Simulator helper
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    # idb's simulator libraries need Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when a Linux check fails
        uses: ./.github/actions/stop-on-linux-failure

      # A new device stays busy for about a quarter of an hour after it boots, so it boots while the job builds.
      - name: Start an iPhone 17 Pro simulator
        run: |
          udid=$(xcrun simctl create "Sikemux CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro)
          echo "SIKEMUX_SIM_DEVICE=$udid" >>"$GITHUB_ENV"
          nohup scripts/boot-ci-simulator.sh "$udid" >"$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/simulator-boot.pid"

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh

      # The cache is restored before the helper is built into target/debug: a
      # restore that only partly matches empties target first.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Build the helper
        run: node scripts/build-sim-helper.mjs --dev

      - name: Run the helper's tests
        run: swift test --package-path helpers/sim

      # idb is copied in from facebook/idb at 45e96c0, as Package.swift says.
      - name: Note the Xcode it was checked against
        run: echo "Checked with $(xcodebuild -version | head -1)" >>"$GITHUB_STEP_SUMMARY"

      - name: Build the app the end-to-end test drives
        run: node scripts/build-sim-fixture.mjs

      - name: Build the simulator tests
        run: cargo test -p sikemux-simulator --lib --no-run

      # A device still busy from its first boot fills the runner's memory and cores, and single
      # screen reads then took up to a minute, so the tests wait until the load is below two per core.
      - name: Wait for the simulator to settle
        timeout-minutes: 20
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/simulator-boot.pid")" 2>/dev/null; do sleep 5; done
          cat "$RUNNER_TEMP/simulator-boot.log"
          grep -q "The simulator is ready" "$RUNNER_TEMP/simulator-boot.log"
          cores=$(sysctl -n hw.ncpu)
          calm=0
          while [ "$calm" -lt 2 ]; do
            sleep 15
            load=$(sysctl -n vm.loadavg | awk '{ print $2 }')
            echo "Load $load"
            if awk -v load="$load" -v cores="$cores" 'BEGIN { exit !(load < 2 * cores) }'; then calm=$((calm + 1)); else calm=0; fi
          done

      - name: Drive a real simulator and the fixture app as an agent would
        env:
          SIKEMUX_SIM_EXECUTABLE: ${{ github.workspace }}/target/debug/sikemux-sim
          SIKEMUX_SIM_FIXTURE: ${{ github.workspace }}/helpers/sim/.build/fixture/Build/Products/Debug-iphonesimulator/SimFixture.app
        run: cargo test -p sikemux-simulator --lib -- --ignored --test-threads=1

  # Nothing else compiles these before a release, and the wire check only proves the notch's
  # generated Swift is fresh, not that the helper still builds against it.
  helpers:
    name: Notch and voice helpers
    needs: changes
    if: needs.changes.outputs.helpers == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when a Linux check fails
        uses: ./.github/actions/stop-on-linux-failure

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install the generators' dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the helpers
        run: pnpm check:helpers
