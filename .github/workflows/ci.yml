name: CI

on:
  push:
    branches: [main, gpui, gpui-linux, remove-tauri-ui]
    # README.md and CONTRIBUTING.md stay out of this list because format:check covers them.
    paths-ignore:
      - "docs/**"
      - AGENTS.md
      - CLA.md
      - CLAUDE.md
      - DESIGN.md
      - RELEASE_NOTES.md
      # server.yml checks and deploys the backend.
      - "server/**"
      # The phone workflows check the phone app.
      - "mobile/**"
      - ".github/workflows/mobile-*.yml"
  # A PR that skipped the whole workflow would leave its required checks waiting forever,
  # so PRs always start it and the changes job skips what they don't touch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub runs schedules only from the default branch.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: Also open GPUI in a real window and capture it
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

# Every push to main gets its own run, so a red main always points at the push that broke it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Cargo.toml builds dependencies at full speed so `make dev` feels fast. CI only
# tests them, and level 1 compiles in about half the time. The cache key carries
# the level, since cargo rebuilds every dependency when it changes.
env:
  DEPS_OPT_LEVEL: 1
  # Tests and checks never read debug info, and leaving it out makes compiling and linking much faster.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Compares against main's last green run rather than the previous push, so a job that
  # failed keeps running until it passes again.
  changes:
    name: What changed
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      simulator: ${{ steps.areas.outputs.simulator }}
      packaging: ${{ steps.areas.outputs.packaging }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Pick the jobs this change needs
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          fi

          git merge-base --is-ancestor "$base" HEAD 2>/dev/null || base=""
          changed="$(git diff --name-only "${base:-HEAD}" HEAD)"
          printf 'Compared with %s:\n%s\n' "${base:-nothing, so every job runs}" "$changed"

          area() {
            name="$1" needs="$2" ignores="${3:-^$}"
            if [ -z "$base" ] || printf '%s\n' "$changed" | grep -vE "$ignores" | grep -qE "^\.github/workflows/ci\.yml$|$needs"; then
              echo "$name=true" >>"$GITHUB_OUTPUT"
            else
              echo "$name=false" >>"$GITHUB_OUTPUT"
              echo "Skipped $name: nothing it checks changed" >>"$GITHUB_STEP_SUMMARY"
            fi
          }
          area rust '^(src-tauri/|browser/|server/protocol/|rust-toolchain\.toml$)'
          area simulator '^(src-tauri/sim/|src-tauri/crates/sikemux-simulator/|src-tauri/Cargo\.(toml|lock)$|scripts/build-sim-(helper|fixture)\.mjs$|rust-toolchain\.toml$)'
          area packaging '^(scripts/build-linux\.sh$|scripts/build-cli-sidecar\.mjs$|src-tauri/linux/|src-tauri/icons/|src-tauri/resources/sikemux_pi_tools\.ts$)'

  # The same check as `pnpm deps:audit`: any vulnerability fails it, and so does any unsound or
  # unmaintained warning dependency-audit.json does not explain. Advisories arrive without a change
  # here, so it also runs on the nightly schedule.
  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit the dependencies
        run: pnpm deps:audit

  frontend:
    name: Frontend quality, build, and tests
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install the generators' dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project formatting
        run: pnpm format:check

      - name: Lint shared code
        run: pnpm lint

      - name: Typecheck shared code
        run: pnpm typecheck

      - name: Check the grammar manifest matches the installed grammars
        run: pnpm grammars:check

      - name: Check the generated wire types match the core's Rust
        run: pnpm wire:check

      - name: Check the generated agent tool list matches its source
        run: pnpm agent-tools:check

      - name: Check the generated agent catalog matches its source
        run: pnpm agent-catalog:check

      - name: Check the docs reference pages match their source
        run: pnpm docs:reference:check

      - name: Check the file icons match the installed icon theme
        run: pnpm file-icons:check

      - name: Check release tooling without credentials
        run: pnpm release:check

      - name: Lint shell scripts
        run: brew install shellcheck && shellcheck scripts/*.sh

  rust:
    name: Rust formatting, lint, and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build dependencies with light optimisation
        run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      # nextest runs every test binary at once; cargo test runs them one after another.
      - name: Install cargo-nextest
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-universal-apple-darwin.tar.gz
          echo "47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$bin"
          echo "$bin" >>"$GITHUB_PATH"

      - name: Run Rust tests
        run: cargo nextest run --workspace --all-targets --all-features
        working-directory: src-tauri

      - name: Build without any plugins
        run: cargo clippy -p sikemux-host --no-default-features --all-targets -- -D warnings
        working-directory: src-tauri

  # The GPUI app is its own workspace, so the job above never builds it.
  gpui:
    name: GPUI app formatting, lint, and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build dependencies with light optimisation
        run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri/crates/sikemux-gpui
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri/crates/sikemux-gpui

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri/crates/sikemux-gpui

      - name: Run Rust tests
        run: cargo test --workspace --all-targets
        working-directory: src-tauri/crates/sikemux-gpui

  # Whether GPUI's Metal renderer draws on a runner: a window is opened in the runner's own
  # session and captured. It takes up to two hours, so it runs daily and by hand with
  # `window` checked, not on every push.
  gpui-window:
    name: GPUI in a real window
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.window)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      - name: Build dependencies with light optimisation
        run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri/crates/sikemux-gpui
            src-tauri
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Build the window probe
        run: cargo build --example window_probe
        working-directory: src-tauri/crates/sikemux-gpui

      - name: Draw a window and capture it
        working-directory: src-tauri/crates/sikemux-gpui
        run: |
          mkdir -p window-run
          system_profiler SPDisplaysDataType > window-run/displays.txt
          ./target/debug/examples/window_probe 30 > window-run/probe.log 2>&1 &
          probe=$!
          for _ in $(seq 1 40); do
            number=$(swift ci/window-number.swift "$probe" 2>/dev/null) && break
            sleep 0.5
          done
          echo "window ${number:-none}" | tee -a window-run/probe.log
          sleep 3
          if [ -n "${number:-}" ]; then screencapture -x -o -l "$number" window-run/window.png; fi
          screencapture -x window-run/screen.png
          kill "$probe" 2>/dev/null || true
          test -s window-run/window.png

      - name: Build the core and the fake agent
        run: cargo build -p sikemux-core --bin sikemux-core --bin sikemux-fake-acp-agent
        working-directory: src-tauri

      - name: Build the app with its in-app driver
        run: cargo build --features drive --bin sikemux --example fake_chat
        working-directory: src-tauri/crates/sikemux-gpui

      # The checks' cores listen on sockets inside their output folders, and a socket's path must stay
      # under 104 bytes, which the checkout's own path would pass.
      - name: Drive the desk checks
        working-directory: src-tauri/crates/sikemux-gpui
        run: >-
          python3 -I ci/desk-checks.py --app target/debug/sikemux
          --core ../../target/debug/sikemux-core --agent ../../target/debug/sikemux-fake-acp-agent
          --seed target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/desk"

      - name: Check the ground's grain, picture and see-through
        if: ${{ !cancelled() }}
        working-directory: src-tauri/crates/sikemux-gpui
        run: >-
          python3 -I ci/ground-check.py --app target/debug/sikemux
          --core ../../target/debug/sikemux-core --agent ../../target/debug/sikemux-fake-acp-agent
          --seed target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/ground"

      - name: Check What's New's sky moves when it opens as the app starts
        if: ${{ !cancelled() }}
        working-directory: src-tauri/crates/sikemux-gpui
        run: >-
          python3 -I ci/sky-check.py --app target/debug/sikemux
          --core ../../target/debug/sikemux-core --agent ../../target/debug/sikemux-fake-acp-agent
          --seed target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/sky"

      - name: Check the core knows its window, and only it, after the window opens again
        if: ${{ !cancelled() }}
        working-directory: src-tauri/crates/sikemux-gpui
        run: >-
          python3 -I ci/trust-check.py --app target/debug/sikemux
          --core ../../target/debug/sikemux-core --agent ../../target/debug/sikemux-fake-acp-agent
          --seed target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/trust"

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-window
          path: |
            src-tauri/crates/sikemux-gpui/window-run
            ${{ runner.temp }}/w
          if-no-files-found: warn

  # The GPUI app on Linux in a real X window: Xvfb with a window manager, the app and a throwaway core with
  # fake agents only, each check captured. With --browser it also opens a desk tab on a local page and drives
  # an agent browser tool there.
  gpui-linux-window:
    name: GPUI on Linux in a real window
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The runner holds no agent CLIs; the core looks only on PATH regardless.
      SIKEMUX_AGENT_SEARCH: path
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      - name: Install GPUI's Linux packages, an X server and a window manager
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libzstd-dev clang pkg-config
            libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
            xvfb openbox x11-utils xdotool imagemagick mesa-vulkan-drivers fonts-dejavu-core
            xdg-desktop-portal xdg-desktop-portal-gtk dconf-gsettings-backend gsettings-desktop-schemas libglib2.0-bin
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly ffmpeg

      - name: Build dependencies with light optimisation
        run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri/crates/sikemux-gpui
            src-tauri
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Build the core and the fake agent
        run: cargo build --locked -p sikemux-core --bin sikemux-core --bin sikemux-fake-acp-agent
        working-directory: src-tauri

      - name: Build the app with its in-app driver
        run: cargo build --locked --features drive --bin sikemux --example fake_chat
        working-directory: src-tauri/crates/sikemux-gpui

      - name: Open the app in a real window and check it
        working-directory: src-tauri/crates/sikemux-gpui
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
          export DISPLAY=:99
          for _ in $(seq 1 40); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.25; done
          openbox &
          sleep 1
          # The desktop portal answers the app's animation setting from GNOME's, which the check toggles.
          export XDG_CURRENT_DESKTOP=GNOME
          mkdir -p ~/.config/xdg-desktop-portal
          printf '[preferred]\ndefault=gtk\n' > ~/.config/xdg-desktop-portal/portals.conf
          bus=(); command -v dbus-run-session >/dev/null && bus=(dbus-run-session --)
          "${bus[@]}" python3 -I ci/linux-window.py --app target/debug/sikemux \
            --core ../../target/debug/sikemux-core --agent ../../target/debug/sikemux-fake-acp-agent \
            --seed target/debug/examples/fake_chat --out "$RUNNER_TEMP/w/linux" --browser --input

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-linux-window
          path: |
            ${{ runner.temp }}/w
            !${{ runner.temp }}/w/linux/run/app
            !${{ runner.temp }}/w/linux/run/bin
            !${{ runner.temp }}/w/linux/run/data/agent-*
          if-no-files-found: warn

  # Every release also ships Linux packages, so main must keep compiling there,
  # and the core must keep working as a Linux host.
  linux:
    name: Linux compile check and core tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      # The Tauri app's, then GPUI's, as Zed's script/linux lists them.
      - name: Install the Linux packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev build-essential file
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libzstd-dev clang pkg-config
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/sikemux-gpui
          cache-on-failure: true

      - name: Check the app compiles on Linux
        run: cargo check --workspace --all-targets --locked
        working-directory: src-tauri

      - name: Check the GPUI app on Linux
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: src-tauri/crates/sikemux-gpui

      - name: Run the core's tests on Linux
        run: cargo test --locked -p sikemux-core -p sikemux-pty -p sikemux-process -p sikemux-wire -p sikemux-client -p sikemux-keychain -p sikemux-host
        working-directory: src-tauri

      # The packages are unsigned and go nowhere but this run.
      - name: Install what the app packs with
        if: needs.changes.outputs.packaging == 'true'
        run: sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig-dev libfreetype-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good dpkg-dev rpm patchelf

      - name: Pack the deb, rpm and AppImage
        if: needs.changes.outputs.packaging == 'true'
        run: scripts/build-linux.sh

      - name: Install the deb on a clean Ubuntu
        if: needs.changes.outputs.packaging == 'true'
        run: |
          docker run --rm -v "$PWD/src-tauri/target/release/bundle/deb:/packages:ro" ubuntu:24.04 sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/*.deb >/dev/null
            sikemux-host --version
            test -g /usr/lib/sikemux/sikemux-host
            test "$(stat -c %G /usr/lib/sikemux/sikemux-host)" = sikemux
            test "$(stat -c %G:%a /var/lib/sikemux)" = sikemux:770
            test -f /usr/lib/sikemux/sikemux_pi_tools.ts
          '

      - name: Keep the packages on the run
        if: needs.changes.outputs.packaging == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-linux-packages
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # The core, the CLI and their clients build on Windows too. Browser tabs are not there yet.
  windows:
    name: Windows compile check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/sikemux-gpui
          cache-on-failure: true

      - name: Check the workspace compiles on Windows
        run: cargo check --workspace --locked
        working-directory: src-tauri

      - name: Check the GPUI app compiles on Windows
        run: cargo check --locked
        working-directory: src-tauri/crates/sikemux-gpui

  simulator-helper:
    name: iOS Simulator helper
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    # idb's simulator libraries need Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh

      # The cache is restored before the helper is built into target/debug: a
      # restore that only partly matches empties target first.
      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      - name: Build dependencies with light optimisation
        run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Build the helper
        run: node scripts/build-sim-helper.mjs --dev

      - name: Run the helper's tests
        run: swift test --package-path src-tauri/sim

      # idb is copied in from facebook/idb at 45e96c0, as Package.swift says.
      - name: Note the Xcode it was checked against
        run: echo "Checked with $(xcodebuild -version | head -1)" >>"$GITHUB_STEP_SUMMARY"

      - name: Build the app the end-to-end test drives
        run: node scripts/build-sim-fixture.mjs

      - name: Build the simulator tests
        working-directory: src-tauri
        run: cargo test -p sikemux-simulator --lib --no-run

      # Booting earlier slowed the builds above by competing for the runner's three cores.
      - name: Boot an iPhone 17 Pro simulator
        timeout-minutes: 10
        # "Booted" comes before the home screen takes input, and the tests no longer compile after it.
        run: |
          udid=$(xcrun simctl create "Sikemux CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro)
          echo "SIKEMUX_SIM_DEVICE=$udid" >>"$GITHUB_ENV"
          export SIKEMUX_SIM_DEVICE="$udid"
          xcrun simctl boot "$SIKEMUX_SIM_DEVICE"
          xcrun simctl bootstatus "$SIKEMUX_SIM_DEVICE" -b
          xcrun simctl launch "$SIKEMUX_SIM_DEVICE" com.apple.Preferences
          sleep 20
          xcrun simctl terminate "$SIKEMUX_SIM_DEVICE" com.apple.Preferences

      - name: Drive a real simulator and the fixture app as an agent would
        working-directory: src-tauri
        env:
          SIKEMUX_SIM_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/debug/sikemux-sim
          SIKEMUX_SIM_FIXTURE: ${{ github.workspace }}/src-tauri/sim/.build/fixture/Build/Products/Debug-iphonesimulator/SimFixture.app
        run: cargo test -p sikemux-simulator --lib -- --ignored --test-threads=1
