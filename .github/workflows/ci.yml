name: CI

on:
  push:
    branches: [main]
    # README.md and CONTRIBUTING.md stay out of this list because format:check covers them.
    paths-ignore:
      - "docs/**"
      - AGENTS.md
      - CLA.md
      - CLAUDE.md
      - DESIGN.md
      - RELEASE_NOTES.md
      # server.yml checks and deploys the backend.
      - "server/**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cargo.toml builds dependencies at full speed so `make dev` feels fast. CI only
# tests them, and level 1 compiles in about half the time. The cache key carries
# the level, since cargo rebuilds every dependency when it changes.
env:
  DEPS_OPT_LEVEL: 1

jobs:
  frontend:
    name: Frontend quality, build, and tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Check the grammar manifest matches the installed grammars
        run: pnpm grammars:check

      - name: Check the generated IPC contracts match the Rust commands
        run: pnpm ipc:check

      - name: Check the generated agent tool list matches its source
        run: pnpm agent-tools:check

      - name: Run frontend tests with all-source coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

      - name: Enforce frontend performance budgets
        run: pnpm perf:budget

      - name: Check release tooling without credentials
        run: pnpm release:check

      - name: Lint shell scripts
        run: brew install shellcheck && shellcheck scripts/*.sh

  rust:
    name: Rust formatting, lint, and tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build dependencies with light optimisation
        run: printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Prepare Tauri resource placeholder
        run: mkdir -p src-tauri/icons/build && touch src-tauri/icons/build/Assets.car

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features
        working-directory: src-tauri

      - name: Build without any plugins
        run: cargo clippy -p sikemux --no-default-features --all-targets -- -D warnings
        working-directory: src-tauri

  simulator-helper:
    name: iOS Simulator helper
    # idb's simulator libraries need Xcode 26 or newer.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the helper
        run: node scripts/build-sim-helper.mjs --dev

      - name: Run the helper's tests
        run: swift test --package-path src-tauri/sim

      - name: Note the Xcode and idb it was checked against
        run: |
          echo "Checked with $(xcodebuild -version | head -1), idb $(cut -c1-12 src-tauri/sim/idb/COMMIT)" >>"$GITHUB_STEP_SUMMARY"

      - name: Build the app the end-to-end test drives
        run: node scripts/build-sim-fixture.mjs

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update

      - name: Prepare Tauri resource placeholder
        run: mkdir -p src-tauri/icons/build && touch src-tauri/icons/build/Assets.car

      - name: Drive a real simulator and the fixture app as an agent would
        working-directory: src-tauri
        env:
          SIKEMUX_SIM_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/debug/sikemux-sim
          SIKEMUX_SIM_FIXTURE: ${{ github.workspace }}/src-tauri/sim/.build/fixture/Build/Products/Debug-iphonesimulator/SimFixture.app
        run: cargo test --lib simulator -- --ignored

  desktop-e2e:
    name: macOS launched desktop E2E
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build dependencies with light optimisation
        run: printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target/e2e
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Launch the built app, open a real editor target and drive a browser tab
        run: pnpm test:e2e:desktop --browser
