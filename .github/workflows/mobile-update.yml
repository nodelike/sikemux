name: Mobile update
run-name: ${{ inputs.update_id && format('{0} phone update {1}', inputs.action, inputs.update_id) || format('Phone update from {0}', github.sha) }}

# The phone's JavaScript and assets go out over the air: every push to main that changes them
# publishes an Android update to nightly. Running this by hand with an update id, once the owner
# approves, promotes that update to stable, withdraws it from every channel so phones that have not
# taken it never do, or rolls back the phones that took it to the code in their build. Phones only
# take an update made for their runtime version, so one that needs new native code waits for the
# build that has it. test/updatePaths.test.ts fails when the bundle reads a file these paths miss.
on:
  push:
    branches: [main]
    paths:
      - "mobile/app/src/**"
      - "mobile/app/assets/**"
      - "mobile/app/index.ts"
      - "mobile/app/modules/*/index.ts"
      - "mobile/app/app.json"
      - "mobile/app/app.config.js"
      - "mobile/app/fingerprint.config.js"
      - "mobile/app/metro.config.js"
      - "mobile/app/tsconfig.json"
      - "mobile/app/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/app/scripts/generate.mjs"
      - "mobile/app/scripts/publish-update.mjs"
      - "mobile/app/scripts/rust-sources.js"
      - "src/agents/agentLaunch.ts"
      - "src/chat/**"
      - "src/lib/paths.ts"
      - "src/lib/platform.ts"
      - "src/terminal/interactions.ts"
      - "src/ui/Icons.tsx"
      - "src/assets/agent-logos/**"
      - .github/workflows/mobile-update.yml
  workflow_dispatch:
    inputs:
      update_id:
        description: Update to act on. Leave empty to publish main to nightly.
        required: false
        default: ""
      action:
        description: What to do with that update.
        type: choice
        options: [promote, withdraw, roll-back]
        default: promote

permissions:
  contents: read

concurrency:
  group: mobile-update-${{ inputs.update_id && 'manage' || 'publish' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and export the phone app
    if: github.repository == 'nodelike/sikemux' && github.ref == 'refs/heads/main' && !inputs.update_id
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.export.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: mobile/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Use the runner's Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      - name: Setup Rust
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update \
            --target aarch64-linux-android --target x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: mobile-android

      # The phone shares chat and UI code with the desktop app, which needs its packages to typecheck.
      - name: Install the desktop app's dependencies
        run: pnpm install --frozen-lockfile

      - name: Install phone dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      # The app's JavaScript imports the bindings generated alongside the Rust client.
      - name: Build the Rust client
        working-directory: mobile
        run: pnpm native:android:release

      - name: Check the phone app
        working-directory: mobile
        run: pnpm check

      # Skipped, with a warning, when no phone release was built for this runtime: the update
      # would reach no phone, and the next phone release ships this code itself.
      - name: Export the update
        id: export
        working-directory: mobile/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-update.mjs prepare android nightly "$RUNNER_TEMP/update"

      - name: Keep the update for signing
        if: steps.export.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-update
          path: ${{ runner.temp }}/update
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Sign and publish to nightly
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-update
          path: ${{ runner.temp }}/update

      - name: Set up the deploy key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Only node's own modules run here: no dependency of the app ever sees the signing key.
      - name: Sign and send it to citadel
        env:
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          export DEPLOY_SSH_KEY_FILE=~/.ssh/deploy_key
          node mobile/app/scripts/publish-update.mjs publish "$RUNNER_TEMP/update"

  approve:
    name: Approve ${{ inputs.action }}
    if: github.repository == 'nodelike/sikemux' && github.ref == 'refs/heads/main' && inputs.update_id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: approval
    steps:
      - name: Approved
        env:
          ACTION: ${{ inputs.action }}
          UPDATE_ID: ${{ inputs.update_id }}
        run: echo "Approved to $ACTION $UPDATE_ID" >>"$GITHUB_STEP_SUMMARY"

  manage:
    name: ${{ inputs.action }} on citadel
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up the deploy key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Rolling back signs the order phones obey with the update key, like an update.
      - name: Act on citadel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          ACTION: ${{ inputs.action }}
          UPDATE_ID: ${{ inputs.update_id }}
          UPDATES_SIGNING_KEY: ${{ inputs.action == 'roll-back' && secrets.UPDATES_SIGNING_KEY || '' }}
        run: |
          export DEPLOY_SSH_KEY_FILE=~/.ssh/deploy_key
          node mobile/app/scripts/publish-update.mjs "$ACTION" "$UPDATE_ID"
