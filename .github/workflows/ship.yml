name: Ship
run-name: Ship ${{ inputs.version && format('v{0}', inputs.version) || 'the waiting candidate' }}

# Makes a stable candidate that soaked on the staff feed the latest release, which is the stable
# feed and the site's download, then moves the package suites, Homebrew and the AUR to it. It runs
# every 10 minutes and ships the candidate as soon as the gate passes, with nobody asked. It
# publishes the candidate's own files and builds nothing, so it ships in a minute.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: The candidate, such as 0.6.1; the staff feed's when left empty
        type: string
      minutes:
        description: How long it must have been on the staff feed
        type: number
        default: 30
      macs:
        description: How many Macs must have updated to it
        type: number
        default: 2

permissions:
  contents: read

# A run that is publishing is never cut short by the next one.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  find:
    name: Find the waiting candidate
    if: github.repository == 'nodelike/sikemux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      - name: Read the staff feed
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            VERSION="$(gh release download staff -R "$GITHUB_REPOSITORY" -p latest.json -O - | jq -r .version || true)"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 0
            waiting="$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isPrerelease,name \
              --jq '.isPrerelease and (.name | endswith("(pulled)") | not)')"
            [[ "$waiting" == true ]] || exit 0
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Candidate: v$VERSION" >>"$GITHUB_STEP_SUMMARY"

  gate:
    name: Check the candidate is ready
    needs: find
    if: needs.find.outputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Holds SENTRY_READ_TOKEN; the job runs only this checkout's own script.
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      release_run: ${{ steps.gate.outputs.release_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather the evidence
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          VERSION: ${{ needs.find.outputs.version }}
          MINUTES: ${{ inputs.minutes || 30 }}
          MACS: ${{ inputs.macs || 2 }}
        run: scripts/ship-gate.sh "$VERSION" "$MINUTES" "$MACS"

  ship:
    name: Make it the stable release
    needs: [find, gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Starts the package suites' moves.
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.find.outputs.version }}
        run: scripts/ship-release.sh "$VERSION"

  # The cask downloads the DMG from the release, so it moves only once that is out.
  homebrew:
    name: Update the Homebrew cask
    needs: [find, ship]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Look for the tap key
        id: token
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          if [[ -n "$HOMEBREW_TAP_SSH_KEY" ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "No HOMEBREW_TAP_SSH_KEY in the release environment, so the cask keeps its last version" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.find.outputs.version }}
          persist-credentials: false

      - name: Download the published DMG
        if: steps.token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.find.outputs.version }}
        run: gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "Sikemux_${VERSION}_aarch64.dmg" -D "$RUNNER_TEMP"

      - name: Push the cask to nodelike/homebrew-tap
        if: steps.token.outputs.configured == 'true'
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          VERSION: ${{ needs.find.outputs.version }}
        run: packaging/homebrew/push-cask.sh "$VERSION" "$RUNNER_TEMP/Sikemux_${VERSION}_aarch64.dmg"

  # The AUR's PKGBUILD downloads the tarball from the release, so it moves only once that is out.
  aur:
    name: Update the AUR package
    needs: [find, gate, ship]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Look for the AUR key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "No AUR_SSH_PRIVATE_KEY in the release environment, so the AUR keeps its last version" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.find.outputs.version }}
          persist-credentials: false

      - name: Fetch the AUR recipe the candidate's run made
        if: steps.key.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-arch-v${{ needs.find.outputs.version }}
          path: target/release/bundle/arch
          run-id: ${{ needs.gate.outputs.release_run }}
          github-token: ${{ github.token }}

      - name: Push it to sikemux-bin
        if: steps.key.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.find.outputs.version }}
        run: packaging/arch/push-aur.sh "$VERSION" target/release/bundle/arch/aur
