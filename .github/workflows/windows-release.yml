name: Windows download

# Builds the Windows installers and proves them on both runners. Dispatch only: it publishes
# nothing and never runs on a push, so CI and Release stay as they are.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, such as 0.6.2-nightly.4; empty takes the nightly version of this commit
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SIKEMUX_SENTRY_DSN: https://f980bd76fa1efc1c3446bbebf4ef1a69@o4512409824919552.ingest.de.sentry.io/4512409865814096
  DO_NOT_TRACK: "1"

jobs:
  installer:
    name: Installer for Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="$(scripts/stamp-nightly.sh)"
          else
            from="$(node -p 'require("./package.json").version')"
            for file in Cargo.toml Cargo.lock; do
              sed -i "s/^version = \"$from\"$/version = \"$VERSION\"/" "$file"
            done
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Sikemux $VERSION for Windows ${{ matrix.arch }}" >>"$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Build the app
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: cargo build --locked --release -p sikemux-app --bin sikemux

      # The core does not compile on Windows yet; the installer carries the app alone until it does.
      - name: Build the core
        id: core
        continue-on-error: true
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: cargo build --locked --release -p sikemux-host --bin sikemux-host

      - name: Say whether the core is in
        env:
          OUTCOME: ${{ steps.core.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            echo "The installer carries the app and its core." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "The core did not build; the installer carries the app alone." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\windows\build.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION -Binaries target\release -Out "$env:RUNNER_TEMP\installer" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Install, open, update and uninstall it
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\installer\*-setup.exe" | Select-Object -First 1
          packaging\windows\prove.ps1 -Installer $installer.FullName -Version $env:VERSION -Out "$env:RUNNER_TEMP\proof"

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/installer/*-setup.exe

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/proof
