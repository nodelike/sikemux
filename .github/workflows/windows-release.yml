name: Windows download

# Builds the Windows installers and proves them on both runners. Release starts it for each
# nightly with that run's id, and then it adds them to the nightly once Release published it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, such as 0.6.2-nightly.4; empty takes the nightly version of this commit
        type: string
        default: ""
      ref:
        description: The commit to build; empty takes the dispatched branch
        type: string
        default: ""
      release_run:
        description: The Release run publishing this nightly; empty publishes nothing
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-download-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DEPS_OPT_LEVEL: 1
  SIKEMUX_SENTRY_DSN: https://f980bd76fa1efc1c3446bbebf4ef1a69@o4512409824919552.ingest.de.sentry.io/4512409865814096
  DO_NOT_TRACK: "1"

jobs:
  installer:
    name: Installer for Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="$(scripts/stamp-nightly.sh)"
          else
            from="$(node -p 'require("./package.json").version')"
            for file in Cargo.toml Cargo.lock; do
              sed -i "s/^version = \"$from\"$/version = \"$VERSION\"/" "$file"
            done
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Sikemux $VERSION for Windows ${{ matrix.arch }}" >>"$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Write the icon and version resources
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\windows\resources.ps1 -Version $env:VERSION -Out "$env:RUNNER_TEMP\resources"

      - name: Build the app
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: cargo rustc --locked --release -p sikemux-app --bin sikemux -- -C "link-arg=$RUNNER_TEMP\resources\sikemux.res"

      # The core does not compile on Windows yet; the installer carries the app alone until it does.
      - name: Build the core
        id: core
        continue-on-error: true
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: cargo rustc --locked --release -p sikemux-host --bin sikemux-host -- -C "link-arg=$RUNNER_TEMP\resources\sikemux-host.res"

      - name: Say whether the core is in
        env:
          OUTCOME: ${{ steps.core.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            echo "The installer carries the app and its core." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "The core did not build; the installer carries the app alone." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\windows\build.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION -Binaries target\release -Resources "$env:RUNNER_TEMP\resources" -Out "$env:RUNNER_TEMP\installer" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Install, open, update and uninstall it
        shell: pwsh
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\installer\*-setup.exe" | Select-Object -First 1
          packaging\windows\prove.ps1 -Installer $installer.FullName -Version $env:VERSION -Out "$env:RUNNER_TEMP\proof"

      # Both entries point at this one installer: the check is of the manifests' shape, not its hashes.
      - name: Write and validate the winget and Scoop manifests
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = (Get-ChildItem "$env:RUNNER_TEMP\installer\*-setup.exe" | Select-Object -First 1).FullName
          $out = "$env:RUNNER_TEMP\proof\manifests"
          packaging\windows\manifests.ps1 -Version $env:VERSION -X64 $installer -Arm64 $installer -Out $out
          winget validate --manifest "$out\winget\manifests\n\Nodelike\Sikemux\$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "winget rejects the manifests" }
          Get-Content "$out\scoop\sikemux.json" -Raw | ConvertFrom-Json | Out-Null

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/installer/*-setup.exe

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/proof

  publish:
    name: Add the installers to the nightly
    needs: installer
    if: ${{ inputs.release_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Wait for Release to publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: gh run watch "$RELEASE_RUN" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null

      - name: Fetch the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-installer-*
          merge-multiple: true
          path: target/windows

      - name: Sign them
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/sign-host.sh "${{ inputs.version }}" windows

      - name: Publish them and repoint the feeds serving this nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-windows.sh "${{ inputs.version }}"
