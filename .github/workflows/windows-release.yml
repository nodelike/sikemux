name: Windows download

# Builds the Windows installers and proves them on both runners. Release starts it for each
# nightly with that run's id, and then it adds them to the nightly once Release published it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, such as 0.6.2-nightly.4; empty takes the nightly version of this commit
        type: string
        default: ""
      ref:
        description: The commit to build; empty takes the dispatched branch
        type: string
        default: ""
      release_run:
        description: The Release run publishing this nightly; empty publishes nothing
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-download-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DEPS_OPT_LEVEL: 1
  SIKEMUX_SENTRY_DSN: https://f980bd76fa1efc1c3446bbebf4ef1a69@o4512409824919552.ingest.de.sentry.io/4512409865814096
  DO_NOT_TRACK: "1"

jobs:
  build:
    name: ${{ matrix.part.name }} for Windows ${{ matrix.target.arch }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
        part:
          - name: App
            package: sikemux-app
            bin: sikemux
          - name: Core
            package: sikemux-host
            bin: sikemux-host
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="$(scripts/stamp-nightly.sh)"
          else
            from="$(node -p 'require("./package.json").version')"
            for file in Cargo.toml Cargo.lock; do
              sed -i "s/^version = \"$from\"$/version = \"$VERSION\"/" "$file"
            done
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Write the icon and version resources
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\windows\resources.ps1 -Version $env:VERSION -Out "$env:RUNNER_TEMP\resources"

      - name: Build ${{ matrix.part.bin }}.exe
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: cargo rustc --locked --release -p ${{ matrix.part.package }} --bin ${{ matrix.part.bin }} -- -C "link-arg=$RUNNER_TEMP\resources\${{ matrix.part.bin }}.res"

      - name: Keep it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.part.bin }}-${{ matrix.target.arch }}
          if-no-files-found: error
          path: target/release/${{ matrix.part.bin }}.exe

  installer:
    name: Installer for Windows ${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set the version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="$(scripts/stamp-nightly.sh)"
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Sikemux $VERSION for Windows ${{ matrix.arch }}" >>"$GITHUB_STEP_SUMMARY"

      - name: Fetch the app and core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-sikemux*-${{ matrix.arch }}
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Write the icon
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\windows\resources.ps1 -Version $env:VERSION -Out "$env:RUNNER_TEMP\resources"

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\windows\build.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION -Binaries "$env:RUNNER_TEMP\binaries" -Resources "$env:RUNNER_TEMP\resources" -Out "$env:RUNNER_TEMP\installer" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Install, open, update and uninstall it
        shell: pwsh
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\installer\*-setup.exe" | Select-Object -First 1
          packaging\windows\prove.ps1 -Installer $installer.FullName -Version $env:VERSION -Out "$env:RUNNER_TEMP\proof"

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/installer/*-setup.exe

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/proof

  # Apart from publish, so a manifest winget would refuse never keeps Windows out of a nightly.
  manifests:
    name: winget and Scoop manifests
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Fetch the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/installer

      - name: Write and validate them
        shell: pwsh
        run: |
          $x64 = Get-Item "$env:RUNNER_TEMP\installer\*_x64-setup.exe"
          $arm64 = Get-Item "$env:RUNNER_TEMP\installer\*_arm64-setup.exe"
          $version = $x64.Name -replace '^Sikemux_(.+)_x64-setup\.exe$', '$1'
          $out = "$env:RUNNER_TEMP\manifests"
          packaging\windows\manifests.ps1 -Version $version -X64 $x64.FullName -Arm64 $arm64.FullName -Out $out
          winget validate --manifest "$out\winget\manifests\n\Nodelike\Sikemux\$version"
          if ($LASTEXITCODE -ne 0) { throw "winget refuses the manifests or warns about them" }
          Get-Content "$out\scoop\sikemux.json" -Raw | ConvertFrom-Json | Out-Null

      - name: Keep them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-manifests
          path: ${{ runner.temp }}/manifests

  release:
    name: Wait for Release to publish the nightly
    if: ${{ inputs.release_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
    steps:
      - name: Stop this run unless the nightly is published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          gh run watch "$RELEASE_RUN" -R "$GITHUB_REPOSITORY" --interval 30 >/dev/null || true
          conclusion="$(gh run view "$RELEASE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          [ "$conclusion" = success ] && exit 0
          echo "Release ended $conclusion, so this nightly gets no Windows installers." >>"$GITHUB_STEP_SUMMARY"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          sleep 300

  # Publishing builds nothing, so it runs the scripts of this workflow's commit, not the release's.
  publish:
    name: Add the installers to the nightly
    needs: [installer, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-installer-*
          merge-multiple: true
          path: target/windows

      - name: Sign them
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/sign-host.sh "${{ inputs.version }}" windows

      - name: Publish them and repoint the feeds serving this nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-windows.sh "${{ inputs.version }}"
