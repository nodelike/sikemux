name: Pacman repository backfill
run-name: Attach the pacman repository to v${{ inputs.version }}

# Adds the signed pacman repository to a stable release published before releases carried one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The stable version, such as 0.6.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  index:
    name: Write sikemux.db
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      - name: Write the index of the release's Arch package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="sikemux-bin-$VERSION-1-x86_64.pkg.tar.zst"
          mkdir -p repo arch
          curl -fsSL -o "repo/$package" "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$package"
          repo-add --quiet repo/sikemux.db.tar.gz "repo/$package"
          cp -L repo/sikemux.db arch/sikemux.db

      - name: Keep the index on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-db
          if-no-files-found: error
          path: arch/sikemux.db

  attach:
    name: Sign and attach the repository
    needs: index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          sparse-checkout: packaging/linux
          persist-credentials: false

      - name: Checkout the signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          sparse-checkout: scripts
          persist-credentials: false

      - name: Fetch the index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-db
          path: bundle/arch

      - name: Fetch the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$VERSION" --repo "${{ github.repository }}" --dir bundle/arch --pattern '*.pkg.tar.zst'
          gh release download "v$VERSION" --repo "${{ github.repository }}" --dir bundle/deb --pattern '*.deb'

      - name: Install the package signing tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils >/dev/null

      - name: Sign the repository
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
          PACKAGES_SIGNING_KEY_PASSWORD: ${{ secrets.PACKAGES_SIGNING_KEY_PASSWORD }}
        run: main/scripts/sign-packages.sh "${{ inputs.version }}" "$PWD/bundle"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          pacman_dir=main/target/packages/pacman
          gh release upload "v$VERSION" --repo "${{ github.repository }}" \
            "$pacman_dir/sikemux.db" "$pacman_dir/sikemux.db.sig" \
            "$pacman_dir/sikemux-bin-$VERSION-1-x86_64.pkg.tar.zst.sig" \
            packaging/linux/sikemux-archive.asc
