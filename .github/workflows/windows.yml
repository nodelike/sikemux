name: Windows

on:
  workflow_dispatch:
    inputs:
      window:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  size:
    name: What W5 adds to the Windows app
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Build both and compare
        run: |
          measure() {
            cargo build --locked --release -p sikemux-app --bin sikemux
            exe=target/release/sikemux.exe
            size=$(stat -c %s "$exe")
            7z a -tzip -mx=9 "$RUNNER_TEMP/$1.zip" "./$exe" >/dev/null
            zipped=$(stat -c %s "$RUNNER_TEMP/$1.zip")
            echo "$1: exe $size bytes, zipped $zipped bytes ($(git rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          git checkout -q HEAD~1
          measure with-w5
          git checkout -q HEAD~2
          measure without-w5
