name: Proof - Linux package window signs in

on:
  push:
    branches: [proof/linux-window-sign-in]

permissions:
  contents: read

env:
  NIGHTLY: v0.6.1-nightly.2863
  APP_ONLY: "only Sikemux's own window or notch can do that"
  GROUP_STRICT: "yes"

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY }}
      - uses: ./.github/actions/setup-rust
      - name: Write a client that makes one call
        run: |
          mkdir -p crates/sikemux-client/examples
          cat > crates/sikemux-client/examples/call.rs <<'RUST'
          #[tokio::main(flavor = "current_thread")]
          async fn main() {
              let mut args = std::env::args().skip(1);
              let socket = std::path::PathBuf::from(args.next().expect("socket"));
              let method = args.next().expect("method");
              let params: serde_json::Value =
                  serde_json::from_str(&args.next().unwrap_or_else(|| "{}".into())).expect("params");
              let (client, _events) = sikemux_client::client::CoreClient::connect(&socket)
                  .await
                  .expect("connect");
              match client.call(&method, params).await {
                  Ok(answer) => println!("{answer}"),
                  Err(error) => {
                      eprintln!("refused: {error}");
                      std::process::exit(1);
                  }
              }
          }
          RUST
      - run: cargo build --locked -p sikemux-client --example call
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call
          path: target/debug/examples/call

  deb:
    needs: client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: call
          path: client
      - name: Install the nightly deb, an X server, and a person outside the sikemux group
        run: |
          set -euxo pipefail
          gh release download "$NIGHTLY" -R "$GITHUB_REPOSITORY" -p 'Sikemux_*_amd64.deb' -D pkg
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./pkg/*.deb xvfb x11-utils imagemagick mesa-vulkan-drivers dbus fonts-dejavu-core >/dev/null
          sudo useradd -m person
          id person
          ! id -nG person | grep -qw sikemux
          getent group sikemux
          stat -c '%A %U:%G %n' /usr/lib/sikemux/sikemux-host /usr/lib/sikemux/sikemux /var/lib/sikemux
          test -g /usr/lib/sikemux/sikemux-host
      - name: Start the packaged window as the person, which starts the packaged core
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
          for _ in $(seq 1 40); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
          sudo -u person env -i HOME=/home/person USER=person LOGNAME=person PATH=/usr/bin:/bin DISPLAY=:99 \
            dbus-run-session -- /usr/bin/sikemux >"$RUNNER_TEMP/window.log" 2>&1 &
          core=
          for _ in $(seq 1 90); do
            for pid in $(pgrep -u person || true); do
              [ "$(sudo readlink "/proc/$pid/exe" || true)" = /usr/lib/sikemux/sikemux-host ] && ! sudo grep -q 'crash reporter' "/proc/$pid/cmdline" && core=$pid
            done
            [ -n "$core" ] && break
            sleep 1
          done
          test -n "$core"
          echo "CORE=$core" >>"$GITHUB_ENV"
          for pid in $(for p in $(pgrep -u person); do [ "$(sudo readlink /proc/$p/exe || true)" = /usr/lib/sikemux/sikemux-host ] && echo $p; done || true); do
            echo "== $pid: $(sudo cat "/proc/$pid/cmdline" | tr '\0' ' ')"
            sudo grep -E '^(Uid|Gid)' "/proc/$pid/status"
            for task in /proc/$pid/task/*; do echo "$(sudo cat "$task/comm"): $(sudo grep ^Gid "$task/status")"; done | sort | uniq -c
          done
          sleep 10
          echo "Only the core's keeper thread may hold the sikemux group:"
          held=$(for task in /proc/$core/task/*; do sudo grep -E '^Gid' "$task/status" | grep -qw "$(getent group sikemux | cut -d: -f3)" && sudo cat "$task/comm"; done || true)
          echo "$held"
          [ "$held" = sikemux-secrets ] || [ "$GROUP_STRICT" = no ]
          others=0
          for pid in $(for p in $(pgrep -u person); do [ "$(sudo readlink /proc/$p/exe || true)" = /usr/lib/sikemux/sikemux-host ] && echo $p; done || true); do
            [ "$pid" = "$core" ] && continue
            others=$((others+1))
            echo "other sikemux-host $pid: $(sudo cat "/proc/$pid/cmdline" | tr '\0' ' ')"
            for task in /proc/$pid/task/*; do if sudo grep -E '^Gid' "$task/status" | grep -qw "$(getent group sikemux | cut -d: -f3)"; then echo "$(sudo cat "$task/comm") holds the group"; [ "$GROUP_STRICT" = no ] || exit 1; fi; done
          done
          [ "$others" -ge 1 ] || [ "$GROUP_STRICT" = no ]
          echo "Every process the person runs, with its groups:"
          for pid in $(pgrep -u person); do echo "$pid $(sudo readlink /proc/$pid/exe) $(sudo grep ^Gid /proc/$pid/status)"; done
          sleep 20
          import -display :99 -window root "$RUNNER_TEMP/window.png"
          window=$(pgrep -u person -x sikemux | head -1)
          sudo readlink "/proc/$window/exe"
      - name: A call only the window may make, from the window's installed path, is accepted
        run: |
          set -euxo pipefail
          socket=/home/person/.config/sikemux/core.sock
          sudo test -S "$socket"
          echo "SOCKET=$socket" >>"$GITHUB_ENV"
          log=$( { sudo find /home/person -xdev -name core.log 2>/dev/null || true; } | head -1)
          echo "Core log: $log; refusals of the real window while it started: $(sudo grep -c "$APP_ONLY" "$log" || true)"
          sudo mv /usr/lib/sikemux/sikemux /usr/lib/sikemux/sikemux.window
          sudo install -m 755 client/call /usr/lib/sikemux/sikemux
          sudo -u person /usr/lib/sikemux/sikemux "$socket" accountSignIn '{}' | tee "$RUNNER_TEMP/accepted.json"
          grep -q '/oauth/authorize?' "$RUNNER_TEMP/accepted.json"
          sudo -u person /usr/lib/sikemux/sikemux "$socket" accountSignInCancel '{}'
      - name: The same program anywhere else is refused
        run: |
          set -euxo pipefail
          install -m 755 client/call /tmp/elsewhere
          if sudo -u person /tmp/elsewhere "$SOCKET" accountSignIn '{}' 2>"$RUNNER_TEMP/refused.txt"; then exit 1; fi
          cat "$RUNNER_TEMP/refused.txt"
          grep -qF "$APP_ONLY" "$RUNNER_TEMP/refused.txt"
      - name: The person cannot open the store
        run: |
          set -x
          ! sudo -u person ls /var/lib/sikemux
          sudo ls -la /var/lib/sikemux
      - if: always()
        run: |
          sudo find /home/person -xdev -name core.log -exec tail -n 80 {} \; || true
          tail -n 40 "$RUNNER_TEMP/window.log" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-proof
          path: |
            ${{ runner.temp }}/window.png
            ${{ runner.temp }}/window.log
            ${{ runner.temp }}/accepted.json
            ${{ runner.temp }}/refused.txt
          if-no-files-found: warn

  arch:
    needs: client
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY }}
          sparse-checkout: packaging/arch
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: call
          path: client
      - name: makepkg builds the AUR recipe, namcap passes it, and the window signs in
        run: |
          mkdir -p out
          docker run --rm -e APP_ONLY -e NIGHTLY -e GROUP_STRICT -v "$PWD/src/packaging/arch:/arch:ro" -v "$PWD/client:/client:ro" -v "$PWD/out:/out" archlinux:latest bash -euxc '
            pacman -Syu --noconfirm --needed -q base-devel namcap sudo curl xorg-server-xvfb xorg-xdpyinfo vulkan-swrast dbus imagemagick ttf-dejavu >/dev/null
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: /usr/bin/pacman" >/etc/sudoers.d/builder
            version=${NIGHTLY#v}
            curl -fsSLo /tmp/Sikemux_${version}_amd64.tar.gz "https://github.com/nodelike/sikemux/releases/download/$NIGHTLY/Sikemux_${version}_amd64.tar.gz"
            install -d -o builder /home/builder/aur
            runuser -u builder -- /arch/prepare.sh "$version" /tmp/Sikemux_${version}_amd64.tar.gz /home/builder/aur
            rm /home/builder/aur/Sikemux_*.tar.gz
            cd /home/builder/aur
            cat PKGBUILD .SRCINFO
            runuser -u builder -- makepkg -s --noconfirm
            pkg=$(ls /home/builder/aur/*.pkg.tar.zst)
            pacman -U --noconfirm "$pkg"
            namcap PKGBUILD "$pkg" | tee /out/namcap.txt
            if grep -q " E: " /out/namcap.txt; then exit 1; fi
            cp PKGBUILD .SRCINFO sikemux.sysusers sikemux.tmpfiles /out/
            curl -fsSLo /tmp/nightly.pkg.tar.zst "https://github.com/nodelike/sikemux/releases/download/$NIGHTLY/sikemux-nightly-bin-${version/-/}-1-x86_64.pkg.tar.zst"
            pacman -U --noconfirm /tmp/nightly.pkg.tar.zst
            pacman -Qi sikemux-nightly-bin | grep -E "^(Name|Version)"
            useradd -m person
            id person
            if id -nG person | grep -qw sikemux; then exit 1; fi
            gid=$(getent group sikemux | cut -d: -f3)
            stat -c "%A %U:%G %n" /usr/lib/sikemux/sikemux-host /usr/lib/sikemux/sikemux /var/lib/sikemux
            test -g /usr/lib/sikemux/sikemux-host
            Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp >/dev/null 2>&1 &
            for _ in $(seq 1 40); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
            runuser -u person -- env -i HOME=/home/person USER=person LOGNAME=person PATH=/usr/bin DISPLAY=:99 dbus-run-session -- /usr/bin/sikemux >/out/window.log 2>&1 &
            core=
            for _ in $(seq 1 90); do
              for pid in $(pgrep -u person -f "^(/usr/lib/sikemux/sikemux-host|sikemux core crash reporter) " || true); do
                grep -q "crash reporter" /proc/$pid/cmdline || core=$pid
              done
              [ -n "$core" ] && break
              sleep 1
            done
            test -n "$core"
            sleep 15
            for pid in $(pgrep -u person -f "^(/usr/lib/sikemux/sikemux-host|sikemux core crash reporter) " || true); do
              echo "== $pid: $(tr "\0" " " </proc/$pid/cmdline)"
              for task in /proc/$pid/task/*; do echo "$(cat $task/comm): $(grep ^Gid $task/status)"; done | sort | uniq -c
            done
            held=$(for task in /proc/$core/task/*; do grep ^Gid $task/status | grep -qw $gid && cat $task/comm; done || true)
            echo "threads of the core holding the group: $held"
            [ "$held" = sikemux-secrets ] || [ "$GROUP_STRICT" = no ]
            others=0
            for pid in $(pgrep -u person -f "^(/usr/lib/sikemux/sikemux-host|sikemux core crash reporter) " || true); do
              [ $pid = $core ] && continue
              others=$((others+1))
              echo "other sikemux-host $pid: $(tr "\0" " " </proc/$pid/cmdline)"
              for task in /proc/$pid/task/*; do if grep ^Gid $task/status | grep -qw $gid; then echo "$pid $(cat $task/comm) holds the group"; [ "$GROUP_STRICT" = no ] || exit 1; fi; done
            done
            [ "$others" -ge 1 ] || [ "$GROUP_STRICT" = no ]
            runuser -u person -- readlink /proc/$(pgrep -u person -x sikemux | head -1)/exe
            import -display :99 -window root /out/window.png || echo "no screenshot"
            socket=/home/person/.config/sikemux/core.sock
            test -S $socket
            echo "refusals of the real window: $(grep -rc "$APP_ONLY" /home/person/.local/share/com.nodelike.sikemux/logs/core.log || true)"
            mv /usr/lib/sikemux/sikemux /usr/lib/sikemux/sikemux.window
            install -m 755 /client/call /usr/lib/sikemux/sikemux
            install -m 755 /client/call /tmp/elsewhere
            runuser -u person -- /usr/lib/sikemux/sikemux $socket accountSignIn "{}" | tee /out/accepted.json
            grep -q "/oauth/authorize?" /out/accepted.json
            runuser -u person -- /usr/lib/sikemux/sikemux $socket accountSignInCancel "{}"
            if runuser -u person -- /tmp/elsewhere $socket accountSignIn "{}" 2>/out/refused.txt; then exit 1; fi
            cat /out/refused.txt
            grep -qF "$APP_ONLY" /out/refused.txt
            if runuser -u person -- ls /var/lib/sikemux; then exit 1; fi
          '
      - if: always()
        run: tail -n 40 out/window.log || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-proof
          path: out
          if-no-files-found: warn
          include-hidden-files: true

  omarchy-pkgs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proof
          sparse-checkout: proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy-pkgs
          ref: 574da542516d6dc29b8dcdfb0d423461bc33b178
          path: pkgs
          persist-credentials: false
      - name: Apply the sikemux-bin recipe and run the repository's package checks
        working-directory: pkgs
        run: |
          set -euxo pipefail
          git -c user.name=proof -c user.email=proof@localhost am ../proof/proof/omarchy-pkgs.patch
          sudo apt-get install -y -qq jq zstd >/dev/null
          for t in package-metadata pinned-sources pkgname-unique pgp-keys-vendored; do bash tests/$t.sh; done
      - name: Point the recipe at this nightly, since no stable release carries the tarball yet
        working-directory: pkgs/pkgbuilds/sikemux-bin
        run: |
          set -euxo pipefail
          version=${NIGHTLY#v}
          sed -i -e "s/^pkgver=.*/pkgver=${version//-/}/" \
            -e "s|download/v\${pkgver}/Sikemux_\${pkgver}_|download/$NIGHTLY/Sikemux_${version}_|" \
            -e "s|\"Sikemux_\${pkgver}_|\"Sikemux_${version}_|g" PKGBUILD
          for a in amd64 arm64; do
            sum=$(curl -fsSL "https://github.com/nodelike/sikemux/releases/download/$NIGHTLY/Sikemux_${version}_$a.tar.gz" | sha256sum | cut -d' ' -f1)
            [ $a = amd64 ] && sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$sum')/" PKGBUILD
            [ $a = arm64 ] && sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$sum')/" PKGBUILD
          done
          cat PKGBUILD
      - name: Build it with the repository's own builder
        working-directory: pkgs
        run: |
          set -euxo pipefail
          arch=x86_64; [ "$(uname -m)" = aarch64 ] && arch=aarch64
          bin/build --package sikemux-bin --arch $arch
          ls -la build-output/*/*/
          bash tests/package-owners.sh || true
          pkg=$(ls build-output/*/$arch/sikemux-bin-*.pkg.tar.zst | head -1)
          tar -tvf "$pkg" | awk '{print $2}' | sort | uniq -c
          echo "PKG=$PWD/$pkg" >>"$GITHUB_ENV"
      - name: Install the built package in Arch and check the store
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          docker run --rm -v "$(dirname "$PKG"):/p:ro" archlinux:latest bash -euxc '
            pacman -Syu --noconfirm -q >/dev/null
            pacman -U --noconfirm /p/sikemux-bin-*.pkg.tar.zst
            stat -c "%a %U:%G %n" /usr/lib/sikemux/sikemux-host /var/lib/sikemux
            [ "$(stat -c "%a %U:%G" /usr/lib/sikemux/sikemux-host)" = "2755 root:sikemux" ]
            [ "$(stat -c "%a %U:%G" /var/lib/sikemux)" = "770 root:sikemux" ]
            sikemux-host --version
          '

  omarchy:
    strategy:
      fail-fast: false
      matrix:
        patched: [yes, no]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SITE: https://nightly.omarchy.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proof
          sparse-checkout: proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: 9e989357f377fe3165aa15c61902963a888ed4b4
          path: src/omarchy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy-pkgs
          ref: 574da542516d6dc29b8dcdfb0d423461bc33b178
          path: src/omarchy-pkgs
          persist-credentials: false
      - if: matrix.patched == 'yes'
        run: git -C src/omarchy -c user.name=proof -c user.email=proof@localhost am "$PWD/proof/proof/omarchy.patch"
      - name: Fetch Omarchy's VM image, as their Tests workflow does
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aria2 jq
          mkdir -p /dev/shm/image && cd /dev/shm/image
          curl -fsS --retry 3 -o latest.json "$SITE/stable/latest.json"
          unpacked=$(jq -r .vm.unpacked latest.json)
          for file in vmlinuz initrd cmdline; do curl -fsS --retry 3 -o "$file" "$unpacked$file"; done
          aria2c --quiet -x 16 -s 16 -o base.qcow2 "$(jq -r .vm.url latest.json)"
          echo "$(jq -r .vm.sha256 latest.json)  base.qcow2" | sha256sum -c -
      - name: Run Omarchy's tests in the VM with the patch applied
        run: |
          sudo chmod 0666 /dev/kvm
          docker run --rm --device /dev/kvm -v "$PWD:/w" -v /dev/shm/image:/image:ro -w /w -e VM_STATE_DIR=/tmp -e MEM=6G \
            ghcr.io/archlinux/archlinux:latest bash -euo pipefail -c '
              if ! grep -qw landlock /sys/kernel/security/lsm 2>/dev/null; then
                printf "#!/bin/sh\nexec /usr/bin/pacman --disable-sandbox \"\$@\"\n" >/usr/local/bin/pacman
                chmod 0755 /usr/local/bin/pacman
              fi
              pacman -Syu --noconfirm --needed qemu-system-x86 qemu-hw-display-virtio-gpu qemu-hw-display-virtio-vga qemu-img openssh >/dev/null
              src/omarchy/test/ci-vm /image src out
            '
      - if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" out 2>/dev/null || true
          grep -n -i 'sikemux\|FAIL' out/run.log | head -60 || true
          sed -n '/^Skipped checks in/,$p' out/run.log || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omarchy-tests-patched-${{ matrix.patched }}
          path: out
          if-no-files-found: warn
