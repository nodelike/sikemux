name: Release
run-name: Release ${{ github.ref_name }}

# A release only ever starts from a v* tag, and only the owner may push one.
on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read
  checks: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  approve:
    name: Approve the stable release
    if: ${{ !contains(github.ref_name, '-nightly.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: approval
    steps:
      - name: Approved
        run: echo "Approved ${GITHUB_REF_NAME}" >>"$GITHUB_STEP_SUMMARY"

  pushed-checks:
    name: Checks already run on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - name: Wait for the CI run from pushing this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA"
          while :; do
            run="$(gh api "$runs" --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')"
            case "$run" in
              "completed success") passed=true; break ;;
              completed* | "" | "null null") passed=false; break ;;
            esac
            sleep 30
          done
          echo "passed=$passed" >>"$GITHUB_OUTPUT"
          echo "CI from the push passed: $passed" >>"$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: pushed-checks
    if: needs.pushed-checks.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version, channel, and notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$heading" != "# Sikemux v$version" ]]; then
            echo "::error::RELEASE_NOTES.md is headed '$heading', not '# Sikemux v$version'"
            exit 1
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "::error::The remote tag v$version is not on $GITHUB_SHA"
            exit 1
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release v$version already exists"
            exit 1
          fi
          case "${version%%+*}" in
            *-nightly.*) channel=nightly ;;
            *-*)
              echo "::error::v$version is neither a nightly nor a stable version"
              exit 1
              ;;
            *) channel=stable ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "Releasing $channel v$version from $GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"

  # Nothing that builds holds signing material, and nothing that signs runs the
  # build's dependencies or what it signs. The app is compiled with the hashes of
  # the voice and simulator helpers it downloads, so they are signed first.
  helpers:
    name: Build the helpers
    needs: [approve, plan]
    if: &approved_plan ${{ !cancelled() && needs.plan.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install XcodeGen
        # The simulator helper builds FBControlCore with it.
        run: scripts/install-xcodegen.sh

      - name: Build the voice and simulator helpers
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--stage helpers)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
          source scripts/release-shape.sh
          (cd packaging/binaries && COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/helpers.tar" "${PUBLISHED_HELPER_FILES[@]}")

      - name: Keep the unsigned helpers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helpers-unsigned
          if-no-files-found: error
          path: ${{ runner.temp }}/helpers.tar

  # The core is not compiled with the helpers' hashes, so it builds alongside them.
  mac-core:
    name: Build the Mac core
    needs: [approve, plan]
    if: *approved_plan
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    # What the core compiles in. The app starts a core rather than running one, and links no plugin.
    env: &compiled_into_core
      BITBUCKET_OAUTH_SECRET: ${{ secrets.BITBUCKET_OAUTH_SECRET }}
      JIRA_OAUTH_SECRET: ${{ secrets.JIRA_OAUTH_SECRET }}
      VERCEL_OAUTH_SECRET: ${{ secrets.VERCEL_OAUTH_SECRET }}
      KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # The core and the app are stripped here, once their symbols are in a dSYM published beside
      # the release. It names a crash's functions but not their lines: line tables carried
      # through the link's LTO need more memory than a runner has, and more than double the build.
      - &keep_symbols
        name: Leave the symbols in for the dSYM
        run: printf '[profile.release]\nstrip = "none"\n[profile.release.package.sikemux-gpui]\nstrip = "none"\n' >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Build the core
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: |
          cargo build --locked --release -p sikemux-host --bin sikemux-host
          dsymutil target/release/sikemux-host -o target/release/sikemux-host.dSYM
          strip target/release/sikemux-host

      - name: Keep the core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-core
          if-no-files-found: error
          path: target/release/sikemux-host

      - name: Pack the core's symbols
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/symbols"
          ditto -c -k --keepParent target/release/sikemux-host.dSYM "$RUNNER_TEMP/symbols/Sikemux_${VERSION}_aarch64.core.dSYM.zip"

      - name: Keep the core's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-symbols-core
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.dSYM.zip

  sign-helpers:
    name: Sign the helpers
    needs: [plan, helpers]
    if: ${{ !cancelled() && needs.helpers.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    outputs:
      notarized: ${{ vars.RELEASE_NOTARIZED == '1' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch helpers-unsigned
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helpers-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Import the Developer ID certificate
        if: vars.RELEASE_NOTARIZED == '1'
        uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign the helpers
        env:
          RELEASE_NOTARIZED: ${{ vars.RELEASE_NOTARIZED == '1' && '1' || '0' }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ "$RELEASE_NOTARIZED" == "1" ]]; then
            [[ -n "$IDENTITY" ]] || { echo "::error::APPLE_SIGNING_IDENTITY is not set"; exit 1; }
            export APPLE_SIGNING_IDENTITY="$IDENTITY"
          fi
          mkdir "$RUNNER_TEMP/helpers"
          tar -xf "$RUNNER_TEMP/unsigned/helpers.tar" -C "$RUNNER_TEMP/helpers"
          source scripts/release-shape.sh
          ./scripts/sign-helper.sh "${PUBLISHED_HELPER_FILES[@]/#/$RUNNER_TEMP/helpers/}"
          (cd "$RUNNER_TEMP/helpers" && COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/helpers.tar" "${PUBLISHED_HELPER_FILES[@]}")

      - name: Keep the signed helpers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helpers
          if-no-files-found: error
          path: ${{ runner.temp }}/helpers.tar

  # The build runs alongside the checks; only publishing waits for them.
  # Starts with the helpers rather than after them: only the helper crates and the app take
  # their hashes, so everything else compiles while they are signed. The core goes into the
  # app only when it is packed, so the app compiles while the core does.
  build:
    name: Build the app
    needs: [approve, plan]
    if: *approved_plan
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt

      # release.sh refreshes Cargo.lock offline, which needs every crate
      # already on disk; a fresh runner has none.
      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - *keep_symbols

      - name: Compile the app around the signed helpers
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packaging/binaries
          # The same build release.sh runs, with the environment it exports, so its work is reused.
          set -m
          (cd app && SIKEMUX_USAGE_REPORTING=app exec cargo build --release --locked --bin sikemux) &
          early=$!
          set +m
          ./scripts/wait-for-artifact.sh helpers "$RUNNER_TEMP/helpers" "Build the helpers" "Sign the helpers"
          # Finished crates are kept; the helper crates and the app rebuild with the hashes.
          kill -TERM -- "-$early" 2>/dev/null || true
          wait "$early" || true
          while pgrep -g "$early" >/dev/null; do sleep 1; done
          tar -xmf "$RUNNER_TEMP/helpers/helpers.tar" -C packaging/binaries
          flags=(--publish --stage compile)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
          dsymutil target/release/sikemux -o target/release/sikemux.dSYM
          strip target/release/sikemux
          mkdir -p "$RUNNER_TEMP/symbols"
          ditto -c -k --keepParent target/release/sikemux.dSYM "$RUNNER_TEMP/symbols/Sikemux_${VERSION}_aarch64.app.dSYM.zip"

      - name: Keep the app's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-symbols-app
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.dSYM.zip

      - name: Fetch the core
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-artifact.sh mac-core "$RUNNER_TEMP/core" "Build the Mac core"

      - name: Pack the app around the core and the signed helpers
        env:
          PREBUILT_CORE: ${{ runner.temp }}/core/sikemux-host
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--publish --stage package)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/app.tar" -C target/release/bundle macos/Sikemux.app dmg

      - name: Keep the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          if-no-files-found: error
          path: ${{ runner.temp }}/app.tar

  sign:
    name: Sign and notarize the app
    # The app job takes the core as soon as it is kept; this waits for the core's job to end well too.
    needs: [plan, sign-helpers, build, mac-core]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.mac-core.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch app-unsigned
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Import the Developer ID certificate
        if: needs.sign-helpers.outputs.notarized == '1'
        uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign, notarize and pack the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTARIZED: ${{ needs.sign-helpers.outputs.notarized }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bundle=target/release/bundle
          mkdir -p "$bundle"
          tar -xf "$RUNNER_TEMP/unsigned/app.tar" -C "$bundle"
          ./scripts/sign-mac.sh "$VERSION"
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/signed.tar" -C "$bundle" macos/Sikemux.app macos/Sikemux.app.tar.gz macos/Sikemux.app.tar.gz.sig dmg

      - name: Keep the signed app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-signed
          if-no-files-found: error
          path: ${{ runner.temp }}/signed.tar

  verify:
    name: Verify the signed release
    needs: [plan, sign-helpers, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch app-signed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-signed
          path: ${{ runner.temp }}/signed

      - name: Fetch helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helpers
          path: ${{ runner.temp }}/helpers

      - name: Verify, start the signed binaries, and write the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTARIZED: ${{ needs.sign-helpers.outputs.notarized }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          mkdir -p target/release/bundle packaging/binaries
          tar -xf "$RUNNER_TEMP/signed/signed.tar" -C target/release/bundle
          tar -xf "$RUNNER_TEMP/helpers/helpers.tar" -C packaging/binaries
          flags=()
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/verify-release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"

      - name: Keep the verified release on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-${{ needs.plan.outputs.version }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/latest.json
            packaging/binaries/*
            latest.json

  # The packages' core builds beside their app, as the Mac's does, on the same machines with the same libraries.
  linux-core:
    name: Build the core of the Linux packages (${{ matrix.arch }})
    needs: approve
    if: &approved ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    strategy:
      matrix:
        include: &linux_machines
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # The oldest runners GitHub still supports; their glibc decides the oldest distribution the packages run on.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env: *compiled_into_core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install what the app builds with
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y <packaging/linux/build-packages.txt

      - name: Build the core
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: cargo build --locked --release -p sikemux-host --bin sikemux-host

      - name: Keep the core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-core-${{ matrix.arch }}
          if-no-files-found: error
          path: target/release/sikemux-host

  build-linux:
    name: Build Linux packages (${{ matrix.arch }})
    needs: approve
    if: *approved
    strategy:
      matrix:
        include: *linux_machines
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install what the app builds and packs with
        run: |
          sudo apt-get update
          cat packaging/linux/build-packages.txt packaging/linux/pack-packages.txt | xargs sudo apt-get install -y

      - name: Compile the app while the core builds
        env:
          SIKEMUX_USAGE_REPORTING: app
          BUILD_STEP: compile
        run: pnpm build:linux

      - name: Fetch the core
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-artifact.sh "linux-core-${{ matrix.arch }}" "$RUNNER_TEMP/core" "Build the core of the Linux packages (${{ matrix.arch }})"

      - name: Build the deb, rpm, AppImage and tarball
        env:
          SIKEMUX_USAGE_REPORTING: app
          PREBUILT_CORE: ${{ runner.temp }}/core/sikemux-host
          BUILD_STEP: package
        run: pnpm build:linux

      - name: Keep the built packages on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-linux-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/tar/*.tar.gz

  # Made from the tarball the deb and rpm are packed from, on Arch itself, where it is installed
  # and upgraded once to check the core keeps its setgid bit.
  build-arch:
    name: Build the Arch package
    needs: [plan, build-linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Install makepkg and namcap
        run: pacman -Syu --noconfirm --needed base-devel namcap

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-linux-x86_64-${{ github.ref_name }}
          path: target/release/bundle

      - name: Build, install and upgrade the package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: packaging/arch/build-release.sh "$VERSION" "target/release/bundle/tar/Sikemux_${VERSION}_amd64.tar.gz" target/release/bundle/arch

      - name: Keep the package and its AUR recipe on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-arch-${{ github.ref_name }}
          if-no-files-found: error
          include-hidden-files: true
          path: target/release/bundle/arch

  build-host:
    name: Build the Linux host core (${{ matrix.arch }})
    needs: approve
    if: *approved
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12's glibc is older than the runner's, so building there lets the core run on both.
    container: rust:1.99-bookworm
    timeout-minutes: 60
    permissions:
      contents: read
    env: *compiled_into_core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the core
        env:
          SIKEMUX_USAGE_REPORTING: host
        run: cargo build --locked --release -p sikemux-host --bin sikemux-host

      - name: Check it runs without a window
        run: scripts/package-host.sh "${{ matrix.arch }}"

      - name: Install it with the installer this release publishes
        run: scripts/smoke-host-install.sh "${{ matrix.arch }}"

      - name: Keep the host core on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-host-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          path: target/host/*.tar.gz

  sign-host:
    name: Sign the Linux host cores and the AppImages
    needs: [plan, build-host, build-linux]
    if: ${{ !cancelled() && needs.build-host.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the Linux host cores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-host-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/host

      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-linux-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/release/bundle

      - name: Sign them
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/sign-host.sh "${{ needs.plan.outputs.version }}"

      - name: Keep the signatures on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-signatures-${{ github.ref_name }}
          if-no-files-found: error
          path: target/host/*.tar.gz.sig

      - name: Keep the AppImage's signature on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-signature-${{ github.ref_name }}
          if-no-files-found: error
          path: target/release/bundle/appimage/*.AppImage.sig

  publish:
    name: Publish
    needs:
      [
        plan,
        verify,
        build-linux,
        build-arch,
        build-host,
        sign-host,
        pushed-checks,
        checks,
      ]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.build-linux.result == 'success' &&
      needs.build-arch.result == 'success' &&
      needs.build-host.result == 'success' && needs.sign-host.result == 'success' &&
      needs.pushed-checks.result == 'success' &&
      (needs.pushed-checks.outputs.passed == 'true' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-${{ needs.plan.outputs.version }}

      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-linux-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/release/bundle

      - name: Fetch the Arch package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-arch-${{ github.ref_name }}
          path: target/release/bundle/arch

      - name: Fetch the Linux host cores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-host-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/host

      - name: Fetch their signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-signatures-${{ github.ref_name }}
          path: target/host

      - name: Fetch the AppImage's signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-signature-${{ github.ref_name }}
          path: target/release/bundle/appimage

      - name: Fetch the Mac symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mac-symbols-*
          merge-multiple: true
          path: target/symbols

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=()
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/publish-release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"

  # The AUR's PKGBUILD downloads the tarball from the release, so it moves only once that is out.
  aur:
    name: Update the AUR package
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Look for the AUR key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "No AUR_SSH_PRIVATE_KEY in the release environment, so the AUR keeps its last version" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the AUR recipe
        if: steps.key.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-arch-${{ github.ref_name }}
          path: target/release/bundle/arch

      - name: Push it to sikemux-bin
        if: steps.key.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: packaging/arch/push-aur.sh "${{ needs.plan.outputs.version }}" target/release/bundle/arch/aur
