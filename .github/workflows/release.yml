name: Release
run-name: Release ${{ github.ref_name }}

# A release only ever starts from a v* tag, and only the owner may push one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, verify, and publish
    needs: checks
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: release

      # release.sh refreshes Cargo.lock offline, which needs every crate already
      # on disk; a fresh runner has none.
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: Resolve version, channel, and notes
        id: plan
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$heading" != "# Sikemux v$version" ]]; then
            echo "::error::RELEASE_NOTES.md is headed '$heading', not '# Sikemux v$version'"
            exit 1
          fi
          if [[ "${version%%+*}" == *-* ]]; then channel=nightly; else channel=stable; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "Releasing $channel v$version from $(git rev-parse HEAD)" >>"$GITHUB_STEP_SUMMARY"

      - name: Import the Developer ID certificate
        if: vars.RELEASE_NOTARIZED == '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$APPLE_CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while read -r existing; do keychains+=("${existing//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"

      - name: Build, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTARIZED: ${{ vars.RELEASE_NOTARIZED || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          flags=(--publish)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"

      - name: Keep the built artifacts on the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sikemux-${{ steps.plan.outputs.version }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/latest.json
            latest.json
