name: Release
run-name: Release ${{ github.ref_name }}

# A release only ever starts from a v* tag, and only the owner may push one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  approve:
    name: Approve the stable release
    if: ${{ !contains(github.ref_name, '-nightly.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: approval
    steps:
      - name: Approved
        run: echo "Approved ${GITHUB_REF_NAME}" >>"$GITHUB_STEP_SUMMARY"

  pushed-checks:
    name: Checks already run on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - name: Wait for the CI run from pushing this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA"
          while :; do
            run="$(gh api "$runs" --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')"
            case "$run" in
              "completed success") passed=true; break ;;
              completed* | "" | "null null") passed=false; break ;;
            esac
            sleep 30
          done
          echo "passed=$passed" >>"$GITHUB_OUTPUT"
          echo "CI from the push passed: $passed" >>"$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: pushed-checks
    if: needs.pushed-checks.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  # The build runs alongside the checks; only publishing waits for them.
  build:
    name: Build and verify
    needs: approve
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      # release.sh refreshes Cargo.lock offline, which needs every crate already
      # on disk; a fresh runner has none.
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: Install XcodeGen
        # The simulator helper builds FBControlCore with it.
        run: brew install xcodegen

      - name: Resolve version, channel, and notes
        id: plan
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$heading" != "# Sikemux v$version" ]]; then
            echo "::error::RELEASE_NOTES.md is headed '$heading', not '# Sikemux v$version'"
            exit 1
          fi
          if [[ "${version%%+*}" == *-* ]]; then channel=nightly; else channel=stable; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "Releasing $channel v$version from $(git rev-parse HEAD)" >>"$GITHUB_STEP_SUMMARY"

      - name: Import the Developer ID certificate
        if: vars.RELEASE_NOTARIZED == '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$APPLE_CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while read -r existing; do keychains+=("${existing//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"

      - name: Build and verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTARIZED: ${{ vars.RELEASE_NOTARIZED || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BITBUCKET_OAUTH_SECRET: ${{ secrets.BITBUCKET_OAUTH_SECRET }}
          JIRA_OAUTH_SECRET: ${{ secrets.JIRA_OAUTH_SECRET }}
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          flags=(--publish)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"

      - name: Keep the built artifacts on the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-${{ steps.plan.outputs.version }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/binaries/sikemux-voice-*
            src-tauri/binaries/sikemux-sim-*
            latest.json

  publish:
    name: Publish
    needs: [build, pushed-checks, checks]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.pushed-checks.result == 'success' &&
      (needs.pushed-checks.outputs.passed == 'true' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-${{ needs.build.outputs.version }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          flags=()
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/publish-release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
