name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && format('nightly from {0}', inputs.sha) || github.ref_name }}

# A stable release starts from a v* tag, which only the owner may push, and publishes a candidate
# that only the staff feed serves; the Ship workflow makes it stable once it soaked there. A
# nightly is a commit of main that passed CI, which the Nightly workflow starts here at most once
# an hour; it goes to the staff feed at once and to nightly after a soak.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit of main to build, which CI passed
        required: true
        type: string

permissions:
  actions: read
  contents: read
  checks: write

# A newer nightly replaces one still building; a stable release never cancels another.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

# Published builds send crashes to these Sentry projects; the addresses are public client keys.
# The binaries this workflow starts to check them send nothing.
env:
  RELEASE_SHA: ${{ inputs.sha || github.sha }}
  SIKEMUX_SENTRY_DSN: https://f980bd76fa1efc1c3446bbebf4ef1a69@o4512409824919552.ingest.de.sentry.io/4512409865814096
  SIKEMUX_NOTCH_SENTRY_DSN: https://6bd8fd04db6ded3d067200c485966e66@o4512409824919552.ingest.de.sentry.io/4512409865945168
  DO_NOT_TRACK: "1"

jobs:
  pushed-checks:
    name: Checks already run on this commit
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - name: Wait for the CI run from pushing this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$RELEASE_SHA"
          while :; do
            run="$(gh api "$runs" --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')"
            case "$run" in
              "completed success") passed=true; break ;;
              completed* | "" | "null null") passed=false; break ;;
            esac
            sleep 30
          done
          echo "passed=$passed" >>"$GITHUB_OUTPUT"
          echo "CI from the push passed: $passed" >>"$GITHUB_STEP_SUMMARY"

      # A nightly started by hand on a commit that failed CI has nothing to ship.
      - name: Stop a nightly whose commit failed CI
        if: github.event_name == 'workflow_dispatch' && steps.wait.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          sleep 60

  checks:
    name: Checks
    needs: [plan, pushed-checks]
    # Also when the wait above timed out, so a slow CI run costs time, never the release. A nightly
    # from main has only CI's verdict: a red one ends it, and the next push gets its own build.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.result == 'success' && needs.pushed-checks.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan the release
    # Nightlies only while `scripts/nightly.sh hold` has not held them.
    if: github.event_name == 'push' || vars.NIGHTLY_HOLD == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Give the commit of main its nightly version and notes
        if: github.event_name == 'workflow_dispatch'
        run: scripts/stamp-nightly.sh

      - name: Resolve version, channel, and notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
              exit 1
            fi
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" --jq .sha)" != "$RELEASE_SHA" ]]; then
              echo "::error::The remote tag v$version is not on $RELEASE_SHA"
              exit 1
            fi
          fi
          heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$heading" != "# Sikemux v$version" ]]; then
            echo "::error::RELEASE_NOTES.md is headed '$heading', not '# Sikemux v$version'"
            exit 1
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release v$version already exists"
            exit 1
          fi
          case "${version%%+*}" in
            *-nightly.*)
              channel=nightly
              if [[ "$(grep '^## ' RELEASE_CHANGES.md | tail -n 1)" != "## v$version · "* ]]; then
                echo "::error::RELEASE_CHANGES.md does not end with v$version, so What's new would wait on GitHub"
                exit 1
              fi
              ;;
            *-*)
              echo "::error::v$version is neither a nightly nor a stable version"
              exit 1
              ;;
            *) channel=stable ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "Releasing $channel v$version from $RELEASE_SHA" >>"$GITHUB_STEP_SUMMARY"

      # Windows builds slower than the Mac, so it runs apart and joins the nightly once both are done.
      - name: Start the Windows installers
        if: steps.plan.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh workflow run windows-release.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f "version=$VERSION" -f "ref=$RELEASE_SHA" -f "release_run=$GITHUB_RUN_ID"

      # Every job builds and describes the release from these, so a push's version reaches them all.
      - name: Keep the version and notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          if-no-files-found: error
          path: |
            package.json
            Cargo.toml
            Cargo.lock
            RELEASE_NOTES.md
            RELEASE_CHANGES.md

  # GitHub refuses Publish's token a tag on a commit whose workflow files no branch has, and main's
  # can change while the nightly builds, so this branch has them until the tag is made.
  keep-workflows:
    name: Keep the nightly's workflow files on a branch
    needs: plan
    if: ${{ needs.plan.outputs.channel == 'nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move nightly-build to the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          gh api --silent -X PATCH "$refs/heads/nightly-build" -f "sha=$RELEASE_SHA" -F force=true ||
            gh api --silent -X POST "$refs" -f "ref=refs/heads/nightly-build" -f "sha=$RELEASE_SHA" ||
            echo "::warning::nightly-build was not moved to $RELEASE_SHA; a workflow change on main can stop this nightly's tag"

  # Nothing that builds holds signing material, and nothing that signs runs the
  # build's dependencies or what it signs. The app is compiled with the hashes of
  # the voice and simulator helpers it downloads, so they are signed first.
  helpers:
    name: Build the helpers
    needs: plan
    if: &planned ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - &plan_files
        name: Take the planned version and notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install XcodeGen
        # The simulator helper builds FBControlCore with it.
        run: scripts/install-xcodegen.sh

      - name: Build the voice and simulator helpers
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--stage helpers)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
          source scripts/release-shape.sh
          (cd packaging/binaries && COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/helpers.tar" "${PUBLISHED_HELPER_FILES[@]}")

      - name: Keep the unsigned helpers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helpers-unsigned
          if-no-files-found: error
          path: ${{ runner.temp }}/helpers.tar

  # The core is not compiled with the helpers' hashes, so it builds alongside them.
  mac-core:
    name: Build the Mac core
    needs: plan
    if: *planned
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    # What the core compiles in. The app starts a core rather than running one, and links no plugin.
    # The core links whole on every channel: in pieces it came out 44.0 MB against 35.3 MB, which
    # pushed a nightly's update past its budget.
    env: &compiled_into_core
      CARGO_PROFILE_RELEASE_LTO: fat
      BITBUCKET_OAUTH_SECRET: ${{ secrets.BITBUCKET_OAUTH_SECRET }}
      JIRA_OAUTH_SECRET: ${{ secrets.JIRA_OAUTH_SECRET }}
      VERCEL_OAUTH_SECRET: ${{ secrets.VERCEL_OAUTH_SECRET }}
      KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - *plan_files

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Stable builds with no cache; a nightly compiles its crates through one.
      - &cache_nightly
        name: Cache compiled crates for a nightly
        if: needs.plan.outputs.channel == 'nightly'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - &compile_through_cache
        name: Compile through the cache
        if: needs.plan.outputs.channel == 'nightly'
        run: printf 'SCCACHE_GHA_ENABLED=true\nRUSTC_WRAPPER=sccache\nSCCACHE_IDLE_TIMEOUT=0\n' >>"$GITHUB_ENV"

      # The core and the app are stripped here, once their symbols are in a debug file published
      # beside the release, with the line tables of Sikemux's own crates. Those add about a tenth to
      # the build; every crate's would need more memory than a runner has, and double it.
      - &keep_symbols
        name: Leave the symbols in for the dSYM
        run: mkdir -p "${CARGO_HOME:-$HOME/.cargo}" && printf '[profile.release]\nstrip = "none"\ndebug = "line-tables-only"\n[profile.release.package."*"]\ndebug = false\n[profile.release.package.sikemux-gpui]\nstrip = "none"\n' >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Build the core
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: |
          cargo build --locked --release -p sikemux-host --bin sikemux-host
          dsymutil target/release/sikemux-host -o target/release/sikemux-host.dSYM
          strip target/release/sikemux-host

      - &cache_stats
        name: Say what the cache saved
        if: needs.plan.outputs.channel == 'nightly'
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-core
          if-no-files-found: error
          path: target/release/sikemux-host

      - name: Pack the core's symbols
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/symbols"
          ditto -c -k --keepParent target/release/sikemux-host.dSYM "$RUNNER_TEMP/symbols/Sikemux_${VERSION}_aarch64.core.dSYM.zip"

      - name: Keep the core's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-symbols-core
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.dSYM.zip

  sign-helpers:
    name: Sign the helpers
    needs: [plan, helpers]
    if: ${{ !cancelled() && needs.helpers.result == 'success' }}
    runs-on: macos-26
    # A job in an environment counts its wait for a runner against this, and Macs queue.
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      notarized: ${{ vars.RELEASE_NOTARIZED == '1' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch helpers-unsigned
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helpers-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Import the Developer ID certificate
        if: vars.RELEASE_NOTARIZED == '1'
        uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign the helpers
        env:
          RELEASE_NOTARIZED: ${{ vars.RELEASE_NOTARIZED == '1' && '1' || '0' }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ "$RELEASE_NOTARIZED" == "1" ]]; then
            [[ -n "$IDENTITY" ]] || { echo "::error::APPLE_SIGNING_IDENTITY is not set"; exit 1; }
            export APPLE_SIGNING_IDENTITY="$IDENTITY"
          fi
          mkdir "$RUNNER_TEMP/helpers"
          tar -xf "$RUNNER_TEMP/unsigned/helpers.tar" -C "$RUNNER_TEMP/helpers"
          source scripts/release-shape.sh
          ./scripts/sign-helper.sh "${PUBLISHED_HELPER_FILES[@]/#/$RUNNER_TEMP/helpers/}"
          (cd "$RUNNER_TEMP/helpers" && COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/helpers.tar" "${PUBLISHED_HELPER_FILES[@]}")

      - name: Keep the signed helpers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helpers
          if-no-files-found: error
          path: ${{ runner.temp }}/helpers.tar

  # The build runs alongside the checks; only publishing waits for them.
  # Starts with the helpers rather than after them: only the helper crates and the app take
  # their hashes, so everything else compiles while they are signed. The core goes into the
  # app only when it is packed, so the app compiles while the core does.
  build:
    name: Build the app
    needs: plan
    if: *planned
    env:
      CARGO_PROFILE_RELEASE_LTO: &lto ${{ needs.plan.outputs.channel == 'stable' && 'fat' || 'thin' }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - *plan_files

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt

      - *cache_nightly

      - *compile_through_cache

      # release.sh refreshes Cargo.lock offline, which needs every crate
      # already on disk; a fresh runner has none.
      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - *keep_symbols

      - name: Compile the app around the signed helpers
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packaging/binaries
          # The same build release.sh runs, with the environment it exports, so its work is reused.
          set -m
          (cd app && SIKEMUX_USAGE_REPORTING=app exec cargo build --release --locked --bin sikemux) &
          early=$!
          set +m
          ./scripts/wait-for-artifact.sh helpers "$RUNNER_TEMP/helpers" "Build the helpers" "Sign the helpers"
          # Finished crates are kept; the helper crates and the app rebuild with the hashes.
          kill -TERM -- "-$early" 2>/dev/null || true
          wait "$early" || true
          while pgrep -g "$early" >/dev/null; do sleep 1; done
          tar -xmf "$RUNNER_TEMP/helpers/helpers.tar" -C packaging/binaries
          flags=(--publish --stage compile)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
          dsymutil target/release/sikemux -o target/release/sikemux.dSYM
          strip target/release/sikemux
          mkdir -p "$RUNNER_TEMP/symbols"
          ditto -c -k --keepParent target/release/sikemux.dSYM "$RUNNER_TEMP/symbols/Sikemux_${VERSION}_aarch64.app.dSYM.zip"

      - *cache_stats

      - name: Keep the app's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-symbols-app
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.dSYM.zip

      - name: Fetch the core
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-artifact.sh mac-core "$RUNNER_TEMP/core" "Build the Mac core"

      - name: Pack the app around the core and the signed helpers
        env:
          PREBUILT_CORE: ${{ runner.temp }}/core/sikemux-host
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--publish --stage package)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/app.tar" -C target/release/bundle macos/Sikemux.app dmg
          ditto -c -k --keepParent target/notch/sikemux-notch.dSYM "$RUNNER_TEMP/symbols/Sikemux_${VERSION}_aarch64.notch.dSYM.zip"

      - name: Keep the notch helper's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-symbols-notch
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.notch.dSYM.zip

      - name: Keep the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          if-no-files-found: error
          path: ${{ runner.temp }}/app.tar

  sign:
    name: Sign and notarize the app
    # The app job takes the core as soon as it is kept; this waits for the core's job to end well too.
    needs: [plan, sign-helpers, build, mac-core]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.mac-core.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch app-unsigned
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Import the Developer ID certificate
        if: needs.sign-helpers.outputs.notarized == '1'
        uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install libdeflate, which packs the updater archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install libdeflate

      - name: Sign, notarize and pack the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTARIZED: ${{ needs.sign-helpers.outputs.notarized }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bundle=target/release/bundle
          mkdir -p "$bundle"
          tar -xf "$RUNNER_TEMP/unsigned/app.tar" -C "$bundle"
          ./scripts/sign-mac.sh "$VERSION"
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/signed.tar" -C "$bundle" macos/Sikemux.app macos/Sikemux.app.tar.gz macos/Sikemux.app.tar.gz.sig dmg

      - name: Keep the signed app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-signed
          if-no-files-found: error
          path: ${{ runner.temp }}/signed.tar

  verify:
    name: Verify the signed release
    needs: [plan, sign-helpers, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - *plan_files

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch app-signed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-signed
          path: ${{ runner.temp }}/signed

      - name: Fetch helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helpers
          path: ${{ runner.temp }}/helpers

      - name: Verify, start the signed binaries, and write the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTARIZED: ${{ needs.sign-helpers.outputs.notarized }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          mkdir -p target/release/bundle packaging/binaries
          tar -xf "$RUNNER_TEMP/signed/signed.tar" -C target/release/bundle
          tar -xf "$RUNNER_TEMP/helpers/helpers.tar" -C packaging/binaries
          flags=()
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/verify-release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"

      - name: Keep the verified release on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-${{ needs.plan.outputs.version }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/latest.json
            packaging/binaries/*
            latest.json

  # The packages' core builds beside their app, as the Mac's does, on the same machines with the same libraries.
  linux-core:
    name: Build the core of the Linux packages (${{ matrix.arch }})
    needs: plan
    if: *planned
    strategy:
      matrix:
        include: &linux_machines
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The packages run on the glibc they were built against and newer, so they build on Ubuntu 22.04,
    # whose 2.35 is the installer's OLDEST_APP_GLIBC.
    container: ubuntu:22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env: *compiled_into_core
    steps:
      - &container_git
        name: Install Git, without which the checkout has no history
        run: apt-get update && apt-get install -y ca-certificates git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - *plan_files

      - &package_tools
        name: Install what the app builds and packs with
        uses: ./.github/actions/linux-package-tools

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - *keep_symbols

      - name: Build the core
        env:
          SIKEMUX_USAGE_REPORTING: app
        run: |
          cargo build --locked --release -p sikemux-host --bin sikemux-host
          scripts/keep-linux-symbols.sh target/release/sikemux-host "$RUNNER_TEMP/symbols/sikemux-host-app-${{ matrix.arch }}.debug"

      - name: Keep the core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-core-${{ matrix.arch }}
          if-no-files-found: error
          path: target/release/sikemux-host

      - name: Keep the core's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-symbols-core-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.debug

  build-linux:
    name: Build Linux packages (${{ matrix.arch }})
    needs: plan
    if: *planned
    strategy:
      matrix:
        include: *linux_machines
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      CARGO_PROFILE_RELEASE_LTO: *lto
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - *container_git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - *plan_files

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - *package_tools

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - *keep_symbols

      - name: Compile the app while the core builds
        env:
          SIKEMUX_USAGE_REPORTING: app
          BUILD_STEP: compile
        run: |
          pnpm build:linux
          scripts/keep-linux-symbols.sh target/release/sikemux "$RUNNER_TEMP/symbols/sikemux-app-${{ matrix.arch }}.debug"

      - name: Keep the app's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-symbols-app-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.debug

      - name: Fetch the core
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-artifact.sh "linux-core-${{ matrix.arch }}" "$RUNNER_TEMP/core" "Build the core of the Linux packages (${{ matrix.arch }})"

      - name: Build the deb, tarball and AppImage
        env:
          SIKEMUX_USAGE_REPORTING: app
          PREBUILT_CORE: ${{ runner.temp }}/core/sikemux-host
          BUILD_STEP: package
        run: pnpm build:linux

      - name: Check the packages run on the oldest glibc the installer offers them to
        run: scripts/check-glibc.sh app target/release/linux/package target/release/linux/Sikemux.AppDir

      - name: Keep the built packages on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-linux-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/tar/*.tar.gz

  # Made from the tarball the deb is packed from, on Arch itself, where it is installed
  # and upgraded once to check the core keeps its setgid bit.
  build-arch:
    name: Build the Arch package
    needs: [plan, build-linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Install makepkg and namcap
        run: pacman -Syu --noconfirm --needed base-devel namcap

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-linux-x86_64-${{ github.ref_name }}
          path: target/release/bundle

      - name: Build, install and upgrade the package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: packaging/arch/build-release.sh "$VERSION" "target/release/bundle/tar/Sikemux_${VERSION}_amd64.tar.gz" target/release/bundle/arch

      - name: Keep the package on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-arch-${{ github.ref_name }}
          if-no-files-found: error
          path: target/release/bundle/arch

  build-host:
    name: Build the Linux host core (${{ matrix.arch }})
    needs: plan
    if: *planned
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A core runs on the glibc it was built against and newer. AlmaLinux 9 has 2.34, the oldest
    # hosts get (RHEL 9, Amazon Linux 2023), so the install check below runs on that oldest too.
    container: almalinux:9
    timeout-minutes: 60
    permissions:
      contents: read
    env: *compiled_into_core
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False gcc make binutils git-core pkgconf-pkg-config zlib-devel tar gzip findutils shadow-utils

      - name: Install rustup
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - *plan_files

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - *keep_symbols

      - name: Build the core
        env:
          SIKEMUX_USAGE_REPORTING: host
        run: |
          cargo build --locked --release -p sikemux-host --bin sikemux-host
          scripts/keep-linux-symbols.sh target/release/sikemux-host "$RUNNER_TEMP/symbols/sikemux-host-host-${{ matrix.arch }}.debug"

      - name: Keep the core's symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-symbols-host-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/symbols/*.debug

      - name: Check it runs without a window
        run: scripts/package-host.sh "${{ matrix.arch }}"

      - name: Install it with the installer this release publishes
        run: scripts/smoke-host-install.sh "${{ matrix.arch }}"

      - name: Keep the host core on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-host-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          path: target/host/*.tar.gz

  sign-host:
    name: Sign the Linux host cores, the AppImages and the package repositories
    needs: [plan, build-host, build-linux, build-arch]
    if: ${{ !cancelled() && needs.build-host.result == 'success' && needs.build-linux.result == 'success' && needs.build-arch.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the Linux host cores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-host-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/host

      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-linux-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/release/bundle

      - name: Sign them
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/sign-host.sh "${{ needs.plan.outputs.version }}"

      - name: Keep the signatures on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-signatures-${{ github.ref_name }}
          if-no-files-found: error
          path: target/host/*.tar.gz.sig

      - name: Keep the AppImages' signatures on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-signature-${{ github.ref_name }}
          if-no-files-found: error
          path: target/release/bundle/appimage/*.AppImage.sig

      - name: Fetch the Arch package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-arch-${{ github.ref_name }}
          path: target/release/bundle/arch

      - name: Install the package signing tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils >/dev/null

      - name: Write the signed apt and pacman indexes
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
          PACKAGES_SIGNING_KEY_PASSWORD: ${{ secrets.PACKAGES_SIGNING_KEY_PASSWORD }}
        run: ./scripts/sign-packages.sh "${{ needs.plan.outputs.version }}" target/release/bundle

      - name: Keep the signed indexes on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-index-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            target/packages/packages-index-*.tar
            target/packages/pacman

  # Holds the Sentry token, so it runs nothing a build does. Sentry names the frames of a
  # release's crashes from these files, so they go before the release does.
  sentry:
    name: Send the symbols to Sentry
    needs: [plan, mac-core, build, linux-core, build-linux, build-host]
    if: >-
      !cancelled() && needs.mac-core.result == 'success' && needs.build.result == 'success' &&
      needs.linux-core.result == 'success' && needs.build-linux.result == 'success' &&
      needs.build-host.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the Mac symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mac-symbols-*
          merge-multiple: true
          path: target/symbols

      - name: Fetch the Linux symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-symbols-*
          merge-multiple: true
          path: target/symbols

      - name: Make the release and send its symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/sentry-release.sh "$VERSION" target/symbols

  rehearsal:
    name: Rehearse the update
    needs: [plan, sign-host]
    if: ${{ !cancelled() && needs.sign-host.result == 'success' }}
    uses: ./.github/workflows/update-rehearsal.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      artifacts: true

  publish:
    name: Publish
    needs:
      [
        plan,
        verify,
        build-linux,
        build-arch,
        build-host,
        sign-host,
        rehearsal,
        sentry,
        pushed-checks,
        checks,
      ]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.build-linux.result == 'success' &&
      needs.build-arch.result == 'success' && needs.sentry.result == 'success' &&
      needs.build-host.result == 'success' && needs.sign-host.result == 'success' &&
      needs.rehearsal.result == 'success' &&
      (needs.pushed-checks.outputs.passed == 'true' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Makes a nightly's tag and starts its soak.
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - *plan_files

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-${{ needs.plan.outputs.version }}

      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-linux-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/release/bundle

      - name: Fetch the apt indexes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-index-${{ github.ref_name }}
          path: target/packages

      - name: Fetch the Arch package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-arch-${{ github.ref_name }}
          path: target/release/bundle/arch

      - name: Fetch the Linux host cores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sikemux-host-*-${{ github.ref_name }}
          merge-multiple: true
          path: target/host

      - name: Fetch their signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-signatures-${{ github.ref_name }}
          path: target/host

      - name: Fetch the AppImages' signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-signature-${{ github.ref_name }}
          path: target/release/bundle/appimage

      - name: Fetch the Mac symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mac-symbols-*
          merge-multiple: true
          path: target/symbols

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=()
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--nightly)
          ./scripts/publish-release.sh "$VERSION" "$(cat RELEASE_NOTES.md)" "${flags[@]}"
