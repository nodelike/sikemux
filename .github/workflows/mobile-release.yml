name: Mobile release
run-name: Mobile release ${{ github.ref_name }}

# A phone release starts from a mobile-v* tag, separate from the Mac's v* tags. A stable one waits
# for the owner's approval on the approval environment; a nightly publishes once its checks pass.
on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  approve:
    name: Approve the stable release
    if: ${{ !contains(github.ref_name, '-nightly.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: approval
    steps:
      - name: Approved
        run: echo "Approved ${GITHUB_REF_NAME}" >>"$GITHUB_STEP_SUMMARY"

  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and channel
        id: plan
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          base="$(node -p "require('./mobile/app/app.json').expo.version")"
          if [[ "${version%%-*}" != "$base" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a release of $base, the version in mobile/app/app.json"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then channel=nightly; else channel=stable; fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "commit=$(git rev-parse --short=7 HEAD)"
          } >>"$GITHUB_OUTPUT"
          echo "Releasing $channel $version from $(git rev-parse HEAD)" >>"$GITHUB_STEP_SUMMARY"

      # Google Play takes the notes with the bundle at the end of the run; a stale or overlong file
      # would only fail there, after the build.
      - name: Check the release notes
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node mobile/app/scripts/play-release.mjs notes "$VERSION"

  # No job that installs or builds the dependencies holds a signing key, and no job that holds one
  # runs them or anything they built: the builds come out unsigned, and the jobs on the release
  # environment sign and upload them with the Android SDK, the JDK and Xcode alone.
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [approve, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    env:
      APP_VARIANT: production
      SIKEMUX_MOBILE_VERSION: ${{ needs.plan.outputs.version }}
      SIKEMUX_MOBILE_CHANNEL: ${{ needs.plan.outputs.channel }}
      # The account sheet shows which commit the build's own code came from.
      EXPO_PUBLIC_COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: mobile/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Use the runner's Java 17 and Android NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      - name: Setup Rust
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update \
            --target aarch64-linux-android --target x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Install phone dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      # Gradle would otherwise download React Native's NDK mid-build, and that download fails often.
      - name: Install the NDK React Native builds with
        working-directory: mobile/app
        run: |
          ndk="$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)"
          for _ in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null && break
            sleep 20
          done
          test -d "$ANDROID_HOME/ndk/$ndk"

      - name: Build the Rust client
        working-directory: mobile
        run: pnpm native:android:release

      - name: Check the phone app
        working-directory: mobile
        run: pnpm check

      - name: Generate the Android project
        working-directory: mobile/app
        run: node scripts/run.mjs prebuild android production

      # Without the upload keystore, plugins/release-signing.js leaves both unsigned.
      - name: Build the unsigned APK and app bundle
        working-directory: mobile/app/android
        run: |
          # The generated project gives Gradle 512 MB of metaspace, which a release build outgrows.
          # The file has no newline at its end, so the setting starts on a line of its own.
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g\n' >>gradle.properties
          grep -x 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g' gradle.properties
          # The Rust client is built for arm64-v8a and x86_64 only. The APK people sideload is for
          # phones, so arm64 alone; Play hands each device its own part of the bundle.
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/unsigned/app.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/unsigned/app.aab"

      - name: Keep the unsigned APK and app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned/*
          if-no-files-found: error

  android-sign:
    name: Sign Android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    needs: [plan, android-build]
    if: ${{ !cancelled() && needs.android-build.result == 'success' }}
    env:
      # The Play upload key's certificate; a release signed with anything else is refused.
      UPLOAD_CERT_SHA256: 4b29a5636b54e630aee1a7037c2cf4f182b7a140ffed36c6a38cafdd2529b32b
    steps:
      - name: Fetch android-unsigned
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Sign the APK and app bundle with the upload key
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          SIKEMUX_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/upload.keystore"
          base64 --decode <<<"$ANDROID_UPLOAD_KEYSTORE" >"$keystore"
          key_cert="$(keytool -list -v -keystore "$keystore" -alias upload -storepass:env SIKEMUX_UPLOAD_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          if [[ "$key_cert" != "$UPLOAD_CERT_SHA256" ]]; then
            echo "::error::The keystore holds $key_cert, not the upload key"
            exit 1
          fi
          mkdir -p dist
          apk="dist/Sikemux_${VERSION}_android.apk"
          aab="dist/Sikemux_${VERSION}_android.aab"
          # Android 15 loads native libraries from 16 KB pages, so they are aligned to them.
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned/app.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias upload \
            --ks-pass env:SIKEMUX_UPLOAD_PASSWORD --key-pass env:SIKEMUX_UPLOAD_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          cp "$RUNNER_TEMP/unsigned/app.aab" "$aab"
          jarsigner -keystore "$keystore" -storepass:env SIKEMUX_UPLOAD_PASSWORD -keypass:env SIKEMUX_UPLOAD_PASSWORD "$aab" upload >/dev/null
          rm "$keystore"

      - name: Check both are signed with the upload key
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk="dist/Sikemux_${VERSION}_android.apk"
          aab="dist/Sikemux_${VERSION}_android.aab"
          "$tools/zipalign" -c -P 16 4 "$apk"
          grep -qx 'jar verified.' <<<"$(jarsigner -verify "$aab")"
          apk_cert="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)"
          aab_cert="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          for cert in "$apk_cert" "$aab_cert"; do
            if [[ "$cert" != "$UPLOAD_CERT_SHA256" ]]; then
              echo "::error::A release is signed with $cert, not the upload key"
              exit 1
            fi
          done
          ls -l dist >>"$GITHUB_STEP_SUMMARY"

      # Over-the-air updates for a runtime no release was built for are not published, so each
      # release says which runtime its build has.
      - name: Record the build's runtime version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          runtime="$(unzip -p "dist/Sikemux_${VERSION}_android.apk" assets/fingerprint)"
          if [[ ! "$runtime" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The APK carries no runtime version"
            exit 1
          fi
          printf '%s\n' "$runtime" >dist/runtime-android.txt
          echo "Runtime version $runtime" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the APK and app bundle on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sikemux-android-${{ needs.plan.outputs.version }}
          path: dist/*
          if-no-files-found: error

  android-publish:
    name: Publish Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    needs: [plan, android-sign]
    if: ${{ !cancelled() && needs.android-sign.result == 'success' }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch sikemux-android-${{ needs.plan.outputs.version }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sikemux-android-${{ needs.plan.outputs.version }}
          path: dist

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          # Never the latest release: sikemux.com takes its Mac download from that one.
          flags=(--latest=false --verify-tag)
          [[ "$CHANNEL" == "nightly" ]] && flags+=(--prerelease)
          notes="$(node mobile/app/scripts/play-release.mjs notes "$VERSION")

          Built from $(git rev-parse --short HEAD). Install the APK on your Android phone. A copy installed from Google Play cannot update this one, or the other way round: to switch, uninstall first."
          # A re-run after a later step failed finds the release already made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/Sikemux_${VERSION}_android.apk" dist/runtime-android.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/Sikemux_${VERSION}_android.apk" dist/runtime-android.txt \
              --title "Sikemux for Android $VERSION" --notes "$notes" "${flags[@]}"
          fi

      # Updates pushed to main while this release was building were skipped, as no release had
      # their runtime yet. Publishing main again now lets this build take them.
      - name: Publish main's update for this build
        if: needs.plan.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$main" == "$GITHUB_SHA" ]]; then
            echo "main is this release's own commit, so there is no update to publish" >>"$GITHUB_STEP_SUMMARY"
          else
            gh workflow run mobile-update.yml --ref main
          fi

      # Last, because Google Play never takes the same version code twice: everything that can be
      # run again has already succeeded.
      - name: Put the app bundle on Google Play
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node mobile/app/scripts/play-release.mjs upload "$VERSION" "dist/Sikemux_${VERSION}_android.aab"

  ios-build:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 120
    needs: [approve, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    env:
      APP_VARIANT: production
      SIKEMUX_MOBILE_VERSION: ${{ needs.plan.outputs.version }}
      SIKEMUX_MOBILE_CHANNEL: ${{ needs.plan.outputs.channel }}
      # The account sheet shows which commit the build's own code came from.
      EXPO_PUBLIC_COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest Xcode on the image, leaving betas out.
      - name: Choose Xcode
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -n 1 >>"$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: mobile/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The phone build takes rustup only from ~/.cargo/bin, and the macOS runner's rustup now comes from Homebrew.
      - name: Setup Rust
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          "$HOME/.cargo/bin/rustup" toolchain install "$channel" --profile minimal --no-self-update \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim

      - name: Install phone dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Build the Rust client
        working-directory: mobile
        run: pnpm native:ios:release

      - name: Generate the iOS project
        working-directory: mobile/app
        run: node scripts/run.mjs prebuild ios production

      # Export takes each bundle's entitlements from the archive's signatures, so the archive is
      # signed ad hoc with them; export then signs it for the App Store.
      - name: Archive, signed ad hoc
        working-directory: mobile/app/ios
        run: |
          archive="$RUNNER_TEMP/Sikemux.xcarchive"
          build=(-workspace Sikemux.xcworkspace -scheme Sikemux -configuration Release -destination generic/platform=iOS)
          xcodebuild "${build[@]}" -archivePath "$archive" CODE_SIGNING_ALLOWED=NO archive
          entitlements="$RUNNER_TEMP/entitlements"
          xcodebuild -project Sikemux.xcodeproj -alltargets -configuration Release -sdk iphoneos \
            -showBuildSettings -json >"$RUNNER_TEMP/settings.json"
          node - "$RUNNER_TEMP/settings.json" "$entitlements" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const [settingsPath, out] = process.argv.slice(2);
          fs.mkdirSync(out, { recursive: true });
          for (const { buildSettings: s } of JSON.parse(fs.readFileSync(settingsPath, 'utf8'))) {
            if (!s.CODE_SIGN_ENTITLEMENTS) continue;
            const text = fs
              .readFileSync(path.resolve(s.SRCROOT, s.CODE_SIGN_ENTITLEMENTS), 'utf8')
              .replaceAll('$(AppIdentifierPrefix)', 'D577WD6Z5U.')
              .replaceAll('$(TeamIdentifierPrefix)', 'D577WD6Z5U.');
            if (text.includes('$(')) throw new Error(`${s.CODE_SIGN_ENTITLEMENTS} uses a setting this step does not fill in`);
            fs.writeFileSync(path.join(out, `${s.FULL_PRODUCT_NAME}.plist`), text);
          }
          NODE
          app="$archive/Products/Applications/Sikemux.app"
          [[ -f "$entitlements/Sikemux.app.plist" ]] || { echo "::error::The app has no entitlements"; exit 1; }
          find "$app" -depth -mindepth 1 \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0 |
            while IFS= read -r -d '' code; do
              args=()
              [[ -f "$entitlements/$(basename "$code").plist" ]] && args=(--entitlements "$entitlements/$(basename "$code").plist")
              codesign --force --sign - --generate-entitlement-der "${args[@]}" "$code"
            done
          codesign --force --sign - --generate-entitlement-der --entitlements "$entitlements/Sikemux.app.plist" "$app"
          codesign --verify --deep --strict "$app"
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf "$RUNNER_TEMP/archive.tar" -C "$RUNNER_TEMP" Sikemux.xcarchive

      - name: Keep the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive
          path: ${{ runner.temp }}/archive.tar
          if-no-files-found: error

  ios-sign:
    name: Sign iOS and send it to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    needs: [plan, ios-build]
    if: ${{ !cancelled() && needs.ios-build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest Xcode on the image, leaving betas out.
      - name: Choose Xcode
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -n 1 >>"$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch ios-archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-archive
          path: ${{ runner.temp }}/download

      # A link out of the archive could point the signing at files outside it.
      - name: Unpack the archive
        run: |
          tar -xf "$RUNNER_TEMP/download/archive.tar" -C "$RUNNER_TEMP"
          archive="$(cd "$RUNNER_TEMP/Sikemux.xcarchive" && pwd -P)"
          while IFS= read -r -d '' link; do
            target="$(realpath "$link" 2>/dev/null)" || target=""
            if [[ "$target" != "$archive"/* ]]; then
              echo "::error::$link points outside the archive"
              exit 1
            fi
          done < <(find "$archive" -type l -print0)
          if [[ -n "$(find "$archive" ! -type f ! -type d ! -type l -print -quit)" ]]; then
            echo "::error::The archive holds something other than files, folders and links"
            exit 1
          fi
          codesign --verify --deep --strict "$archive/Products/Applications/Sikemux.app"

      # Xcode makes or fetches the distribution certificate and the profiles for the app and its
      # notification extension with the App Store Connect API key, and sends the build to TestFlight.
      - name: Revoke the development certificates earlier runs made
        working-directory: mobile/app
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/testflight-release.mjs prune-certificates

      - name: Sign and send to TestFlight
        id: upload
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" >"$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          archive="$RUNNER_TEMP/Sikemux.xcarchive"
          cat >"$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>D577WD6Z5U</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm "$key"
          build="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$archive/Info.plist")"
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "Sent build $build to TestFlight" >>"$GITHUB_STEP_SUMMARY"

      - name: Send the build to the external testers through beta review
        working-directory: mobile/app
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ steps.upload.outputs.build }}
        run: node scripts/testflight-release.mjs submit "$VERSION" "$BUILD"
