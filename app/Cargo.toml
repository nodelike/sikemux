[package]
name = "sikemux-app"
version.workspace = true
edition = "2021"
publish = false
description = "The desktop app's program: it opens sikemux-gpui's window and says which build it is"
# src/lib.rs is sikemux-gpui's, whose package is in lib/.
autolib = false

# How the app is named and known to the system, for the release scripts and the core.
[package.metadata.sikemux]
name = "Sikemux"
description = "The IDE for you and your coding agents"
identifier = "com.nodelike.sikemux"
dev-name = "Sikemux Dev"
dev-identifier = "com.nodelike.sikemux.dev"
minimum-macos = "11.0"
core-link = "../Helpers/Sikemux Core.app/Contents/MacOS/sikemux-host"
updater-key = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDg5NDQ0RDU4NDA4ODY0NEYKUldSUFpJaEFXRTFFaVhCRmkrNmFmZDNNb1djWmNvbkdYMXkxT1Z4cUJlb1VWNzJCMnE5blJkMkMK"

# The core trusts the program named this beside it as its app.
[[bin]]
name = "sikemux"
path = "src/main.rs"

[features]
# The test bundle's kit: drives the window from step files. Never on in a release.
drive = ["sikemux-gpui/drive"]
# Counts the transcript's drawing work, which the stress example prints beside a slow frame.
# Never on in a release.
counts = ["sikemux-gpui/counts"]

[dependencies]
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component"] }
sikemux-browser = { path = "../crates/sikemux-browser" }
sikemux-buildinfo = { path = "../crates/sikemux-buildinfo" }
sikemux-gpui = { path = "lib" }
sikemux-hostkit = { path = "../crates/sikemux-hostkit" }
sikemux-process = { path = "../crates/sikemux-process" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# What the examples use themselves.
[dev-dependencies]
anyhow = "1"
film-frame = { path = "crates/film-frame" }
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["test-support", "bench-support"] }
gpui-base = { version = "=0.8.1", features = ["test-support"] }
# Not named by an example, but the kit builds only with test-support on in all of it or none.
gpui-component = { version = "=0.8.1", default-features = false, features = ["test-support"] }
gpui-native-view = { path = "crates/gpui-native-view" }
gpui-transcript = { path = "crates/gpui-transcript" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
libc = "0.2"
serde_json = "1"
sikemux-agents = { path = "../crates/sikemux-agents" }
sikemux-base = { path = "../crates/sikemux-base" }
sikemux-calls = { path = "../crates/sikemux-calls" }
sikemux-client = { path = "../crates/sikemux-client" }
sikemux-corekit = { path = "../crates/sikemux-corekit" }
sikemux-fold = { path = "../crates/sikemux-fold" }
sikemux-view = { path = "../crates/sikemux-view" }
sikemux-wire = { path = "../crates/sikemux-wire" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit"] }
