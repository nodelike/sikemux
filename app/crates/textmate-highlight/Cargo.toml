[package]
name = "textmate-highlight"
version = "0.1.0"
edition = "2021"
description = "Shiki's TextMate grammars, loaded lazily from one compressed bundle and highlighted line by line"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["textmate", "shiki", "syntax", "highlighting"]
categories = ["text-processing"]
publish = false

[dependencies]
flate2 = "1"
irosashi = { version = "0.3", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
