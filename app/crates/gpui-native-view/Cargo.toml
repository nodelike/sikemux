[package]
name = "gpui-native-view"
version = "0.1.0"
edition = "2021"
description = "Shows a native view in a GPUI element's place, under the window's overlays"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gpui", "native", "view"]
categories = ["gui"]
publish = false

[dependencies]
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.10" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphics", "NSResponder", "NSView", "NSWindow", "block2", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSKeyValueObserving", "NSObject", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewView", "objc2-app-kit"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSScrollView", "NSText", "NSTextView", "NSView", "NSWindow", "NSClipView"] }
