# Kernel settings for citadel, installed as /etc/sysctl.d/60-sikemux.conf. Every device holds a
# socket to Caddy, and Caddy opens another to the API or relay on this machine for each one.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 5000
net.ipv4.ip_local_port_range = 10240 65535
