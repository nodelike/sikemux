# Postgres settings for citadel, installed as /etc/postgresql/17/main/conf.d/sikemux.conf.
# Sized for the 8 GB machine it shares with the API, the relay and Caddy, on NVMe disks.
shared_buffers = 1GB
effective_cache_size = 4GB
maintenance_work_mem = 256MB
work_mem = 8MB
random_page_cost = 1.1
effective_io_concurrency = 200
max_wal_size = 2GB
