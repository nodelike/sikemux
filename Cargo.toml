[workspace]
members = ["app", "app/crates/*", "crates/*", "plugins/*", "plugins/*/views"]
# A bare cargo run here leaves out the GPUI app and its crates, which take far longer to build than the
# core; name them with -p to build them.
default-members = ["crates/*", "plugins/*", "plugins/*/views"]
resolver = "2"

[workspace.package]
version = "0.6.0-nightly.10"

# Only crates that set `lints.workspace = true` get these, which is every
# plugin crate and not the app. A plugin that panics takes the app down.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"

# `make dev` runs an unoptimized build, and the crates that read git objects,
# diff them and parse terminal output are all third party. Leaving them at the
# debug default makes a diff take seconds to appear. Our own code stays
# unoptimized so it still compiles quickly.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Frames films pixel by pixel; "*" covers only crates outside this workspace.
[profile.dev.package.film-frame]
opt-level = 3
debug = false

# The phone app's build: as fast as release, but a panic in one background
# task fails that task instead of closing the whole app.
[profile.mobile]
inherits = "release"
panic = "unwind"
opt-level = "z"
[profile.mobile.package."*"]
opt-level = "z"

# Built for size, which takes about 1.8 MB off the DMG.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Layout and drawing run every frame.
[profile.release.package.gpui-pre]
opt-level = 3
[profile.release.package.gpui-pre-apple]
opt-level = 3
[profile.release.package.gpui-pre-macos]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3
[profile.release.package.gpui-transcript]
opt-level = 3

# Plugins never sit on a hot path, so they go further and are built for the
# smallest size.
[profile.release.package.sikemux-plugin-aws]
opt-level = "z"
[profile.release.package.sikemux-plugin-bitbucket]
opt-level = "z"
[profile.release.package.sikemux-plugin-bruno]
opt-level = "z"
