[package]
name = "sikemux-web-device"
version = "0.1.0"
edition = "2021"
publish = false
description = "The web app as a device on the person's account, reading a host's look"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
serde_json = "1"
sikemux-wire = { path = "../sikemux-wire" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
