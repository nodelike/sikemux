[package]
name = "sikemux-corekit"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# For the tests of crates built on this one: the fixtures its own tests use.
testing = []

[dependencies]
sikemux-base = { path = "../sikemux-base" }
sikemux-grid = { path = "../sikemux-grid" }
base64 = "0.22"
sikemux-process = { path = "../sikemux-process" }
globset = "0.4"
hex = "0.4"
memchr = "2"
quick-xml = "0.42"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sikemux-view = { path = "../sikemux-view" }
sikemux-wire = { path = "../sikemux-wire" }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
libc = "0.2"
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["form", "gzip", "json", "query", "rustls-no-provider", "stream"] }
ring = "0.17"
sikemux-client = { path = "../sikemux-client" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "getrandom", "rand", "ring", "rustls-bring-your-own-connector", "server", "sha1_smol"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
