[package]
name = "sikemux-hostkit"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false }
sentry = { version = "0.49", default-features = false, features = ["contexts", "debug-images", "minidump", "release-health", "reqwest", "rustls-no-provider"] }
sikemux-base = { path = "../sikemux-base" }
sikemux-corekit = { path = "../sikemux-corekit" }
sikemux-process = { path = "../sikemux-process" }
sikemux-pty = { path = "../sikemux-pty" }
sikemux-client = { path = "../sikemux-client" }
log = "0.4"
minidump-common = "0.26"
regex = "1"
scroll = "0.12"
sha2 = "0.11"
sikemux-wire = { path = "../sikemux-wire" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", all(windows, target_arch = "x86_64")))'.dependencies]
framehop = { version = "0.15", default-features = false, features = ["std", "pe"] }
object = { version = "0.37", default-features = false, features = ["elf", "pe", "read_core", "std"] }

[target.'cfg(windows)'.dependencies]
backtrace = "0.3"
sikemux-trust = { path = "../sikemux-trust" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
crash-context = "0.6"
minidump-writer = "0.12"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
