[package]
name = "sikemux-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Test kits only: dial hosts also at the addresses dev/host-addresses.json names, as local test
# cores have no relay to meet through. Never on in a release.
host-addresses-file = []

[dependencies]
sikemux-agents = { path = "../sikemux-agents" }
sikemux-base = { path = "../sikemux-base" }
sikemux-calls = { path = "../sikemux-calls" }
sikemux-corekit = { path = "../sikemux-corekit" }
sikemux-process = { path = "../sikemux-process" }
sikemux-fold = { path = "../sikemux-fold" }
sikemux-markdown = { path = "../sikemux-markdown" }
hex = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
ignore = "0.4"
globset = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sentry-core = { version = "0.49", default-features = false }
sha2 = "0.11"
sikemux-pty = { path = "../sikemux-pty" }
sikemux-plugin-api = { path = "../sikemux-plugin-api" }
sikemux-grid = { path = "../sikemux-grid" }
sikemux-wire = { path = "../sikemux-wire" }
sikemux-view = { path = "../sikemux-view" }
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

base64 = "0.22"
sikemux-client = { path = "../sikemux-client" }
sikemux-git = { path = "../sikemux-git" }
sikemux-kernel = { path = "../sikemux-kernel" }
sikemux-serve = { path = "../sikemux-serve" }
sikemux-workspace = { path = "../sikemux-workspace" }
sikemux-chat = { path = "../sikemux-chat" }
sikemux-remote = { path = "../sikemux-remote" }
sikemux-repo = { path = "../sikemux-repo" }
sikemux-board = { path = "../sikemux-board" }
sikemux-keychain = { path = "../sikemux-keychain" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
notify = "8"
portable-pty = "0.9"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "gzip", "json", "query", "rustls-no-provider", "stream"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "getrandom", "rand", "ring", "rustls-bring-your-own-connector", "server", "sha1_smol"] }
toml = "1"
trash = "5"

[target.'cfg(windows)'.dependencies]
sikemux-trust = { path = "../sikemux-trust" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
sikemux-corekit = { path = "../sikemux-corekit", features = ["testing"] }
sikemux-chat = { path = "../sikemux-chat", features = ["testing"] }
sikemux-remote = { path = "../sikemux-remote", features = ["testing"] }
sikemux-repo = { path = "../sikemux-repo", features = ["testing"] }
sikemux-serve = { path = "../sikemux-serve", features = ["testing"] }
tempfile = "3"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSGeometry", "NSString"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
