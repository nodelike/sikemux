[package]
name = "sikemux-simulator"
version.workspace = true
edition = "2021"
publish = false
description = "The iOS Simulator and Android emulators for agents and the desk: the device helpers, who holds which device, and the agents' tools, with no UI toolkit"

[dependencies]
base64 = "0.22"
bytes = "1"
h2 = "0.4"
http = "1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sikemux-base = { path = "../sikemux-base" }
sikemux-process = { path = "../sikemux-process" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "net", "macros", "process"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
hex = "0.4"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
