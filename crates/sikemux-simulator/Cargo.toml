[package]
name = "sikemux-simulator"
version.workspace = true
edition = "2021"
publish = false
description = "The iOS Simulator for agents and the desk: the device helper, who holds which device, and the agents' tools, with no UI toolkit"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sikemux-base = { path = "../sikemux-base" }
sikemux-process = { path = "../sikemux-process" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "net", "macros"] }

[build-dependencies]
hex = "0.4"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
