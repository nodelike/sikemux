[package]
name = "sikemux-remote"
version.workspace = true
edition = "2021"
publish = false

[features]
# For the tests of the core built on this crate: the stand-ins its own tests use.
testing = []

[target.'cfg(unix)'.dependencies]
sikemux-agents = { path = "../sikemux-agents" }
sikemux-base = { path = "../sikemux-base" }
sikemux-calls = { path = "../sikemux-calls" }
sikemux-chat = { path = "../sikemux-chat" }
sikemux-corekit = { path = "../sikemux-corekit" }
sikemux-fold = { path = "../sikemux-fold" }
sikemux-kernel = { path = "../sikemux-kernel" }
sikemux-keychain = { path = "../sikemux-keychain" }
sikemux-plugin-api = { path = "../sikemux-plugin-api" }
sikemux-process = { path = "../sikemux-process" }
sikemux-pty = { path = "../sikemux-pty" }
sikemux-serve = { path = "../sikemux-serve" }
sikemux-workspace = { path = "../sikemux-workspace" }
sikemux-view = { path = "../sikemux-view" }
sikemux-wire = { path = "../sikemux-wire" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
sikemux-client = { path = "../sikemux-client" }
sikemux-loopback = { path = "../sikemux-loopback" }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["form", "gzip", "json", "query", "rustls-no-provider", "stream"] }
base64 = "0.22"
ring = "0.17"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
curve25519-dalek = { version = "5", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
block2 = "0.6"
