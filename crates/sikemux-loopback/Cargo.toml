[package]
name = "sikemux-loopback"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23"
getrandom = "0.3"
hex = "0.4"
sha2 = "0.11"
url = "2"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
