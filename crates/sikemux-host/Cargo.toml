[package]
name = "sikemux-host"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "sikemux_host"

[[bin]]
name = "sikemux-host"
path = "src/main.rs"

[features]
default = ["aws", "bitbucket", "cloudflare", "database", "forgejo", "github", "gitlab", "googleplay", "jira", "linear", "rundeck", "signoz", "slack", "vercel"]
# Films and pictures only: browser sign-ins end by themselves, with no browser and no Keychain.
stand-in-sign-ins = []
aws = ["dep:sikemux-plugin-aws"]
bitbucket = ["dep:sikemux-plugin-bitbucket"]
cloudflare = ["dep:sikemux-plugin-cloudflare"]
forgejo = ["dep:sikemux-plugin-forgejo"]
gitlab = ["dep:sikemux-plugin-gitlab"]
googleplay = ["dep:sikemux-plugin-googleplay"]
database = ["dep:sikemux-plugin-database"]
github = ["dep:sikemux-plugin-github"]
jira = ["dep:sikemux-plugin-jira"]
linear = ["dep:sikemux-plugin-linear"]
rundeck = ["dep:sikemux-plugin-rundeck"]
signoz = ["dep:sikemux-plugin-signoz"]
slack = ["dep:sikemux-plugin-slack"]
vercel = ["dep:sikemux-plugin-vercel"]

[dependencies]
serde = { version = "1", features = ["derive"] }
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
uuid = { version = "1", features = ["v4", "v7"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
log = "0.4"
sikemux-buildinfo = { path = "../sikemux-buildinfo" }
sikemux-client = { path = "../sikemux-client" }
sikemux-core = { path = "../sikemux-core" }
sikemux-hostkit = { path = "../sikemux-hostkit" }
sikemux-view = { path = "../sikemux-view" }
sikemux-wire = { path = "../sikemux-wire" }
sikemux-loopback = { path = "../sikemux-loopback" }
sikemux-keychain = { path = "../sikemux-keychain" }
sikemux-process = { path = "../sikemux-process" }
sikemux-release = { path = "../sikemux-release" }
sikemux-pty = { path = "../sikemux-pty" }
sikemux-plugin-api = { path = "../sikemux-plugin-api" }
sikemux-plugin-aws = { path = "../../plugins/aws", optional = true }
sikemux-plugin-bitbucket = { path = "../../plugins/bitbucket", optional = true }
sikemux-plugin-cloudflare = { path = "../../plugins/cloudflare", optional = true }
sikemux-plugin-forgejo = { path = "../../plugins/forgejo", optional = true }
sikemux-plugin-gitlab = { path = "../../plugins/gitlab", optional = true }
sikemux-plugin-database = { path = "../../plugins/database", optional = true }
sikemux-plugin-github = { path = "../../plugins/github", optional = true }
sikemux-plugin-googleplay = { path = "../../plugins/googleplay", optional = true }
sikemux-plugin-jira = { path = "../../plugins/jira", optional = true }
sikemux-plugin-linear = { path = "../../plugins/linear", optional = true }
sikemux-plugin-rundeck = { path = "../../plugins/rundeck", optional = true }
sikemux-plugin-signoz = { path = "../../plugins/signoz", optional = true }
sikemux-plugin-slack = { path = "../../plugins/slack", optional = true }
sikemux-plugin-vercel = { path = "../../plugins/vercel", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sikemux-corekit = { path = "../sikemux-corekit" }
sikemux-trust = { path = "../sikemux-trust" }

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"
sikemux-agents = { path = "../sikemux-agents" }
sikemux-drivers = { path = "../sikemux-drivers" }
sikemux-fold = { path = "../sikemux-fold" }

[lints]
workspace = true
