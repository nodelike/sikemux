[package]
name = "sikemux-repo"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# For the tests of the core built on this crate.
testing = []

[dependencies]
sikemux-remote = { path = "../sikemux-remote" }
sikemux-git = { path = "../sikemux-git" }
notify = "8"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
tempfile = "3"
ignore = "0.4"
toml = "1"
sikemux-agents = { path = "../sikemux-agents" }
sikemux-base = { path = "../sikemux-base" }
sikemux-calls = { path = "../sikemux-calls" }
sikemux-corekit = { path = "../sikemux-corekit" }
sikemux-fold = { path = "../sikemux-fold" }
sikemux-plugin-api = { path = "../sikemux-plugin-api" }
sikemux-process = { path = "../sikemux-process" }
sikemux-pty = { path = "../sikemux-pty" }
sikemux-view = { path = "../sikemux-view" }
sikemux-wire = { path = "../sikemux-wire" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
