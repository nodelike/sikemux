disallowed-methods = [
    { path = "std::process::Command::new", reason = "use sikemux_process::user_environment::command, so the child gets the user's PATH" },
    { path = "tokio::process::Command::new", reason = "use sikemux_process::user_environment::command(..).into_async(), so the child gets the user's PATH" },
    { path = "sikemux_process::command::Command::new", reason = "use sikemux_process::user_environment::command, so the child gets the user's PATH" },
    { path = "gpui::StatefulInteractiveElement::on_click", reason = "use gpui_clicks::Clicks (crate::ui::Clicks): `clicks` shows the pointing hand, `clicks_keep_cursor` keeps the arrow" },
    { path = "std::fs::canonicalize", reason = "use sikemux_process::files::real_path, which leaves off Windows' \\\\?\\ prefix" },
    { path = "std::path::Path::canonicalize", reason = "use sikemux_process::files::real_path, which leaves off Windows' \\\\?\\ prefix" },
]
